const MiniChart=({data,dk,color,t,h=70})=>{

  return React.createElement("div",{style:{display:"flex",alignItems:"flex-end",gap:3,height:h,padding:"4px 0"}},

      React.createElement("span",{style:{fontSize:"0.58rem",color:t.textMuted}},d.d||d.m)
    ))

};

// FIX BUG-017 (Modal): add Escape key + aria attributes
const Modal=({open,onClose,title,children,t,wide})=>{
  useEffect(()=>{
    if(!open)return;
    const h=e=>{if(e.key==="Escape")onClose();};
    document.addEventListener("keydown",h);
    return()=>document.removeEventListener("keydown",h);
  },[open,onClose]);
  if(!open)return null;
  return React.createElement("div",{role:"dialog","aria-modal":"true","aria-label":title,style:{position:"fixed",inset:0,zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:24},onClick:onClose},
    React.createElement("div",{style:{position:"absolute",inset:0,background:"rgba(0,0,0,0.5)",backdropFilter:"blur(4px)"}}),
    React.createElement("div",{onClick:e=>e.stopPropagation(),style:{position:"relative",background:t.bgCard,borderRadius:12,boxShadow:t.shadowLg,width:"100%",maxWidth:wide?720:520,maxHeight:"85vh",overflow:"auto",border:`1px solid ${t.border}`,animation:"slideUp 0.25s ease"}},

  // FIX BUG-001: reset pagination on filter change
  useEffect(()=>setUp(1),[uf]);

  useEffect(()=>setSelUsers([]),[uf]);

  // Close mobile sidebar on page change

  const closeModal=()=>{setModal(null);setFormErrors({});};

        ),
        React.createElement(Field,{label:"Tələbə sayı"},
          React.createElement("input",{type:"number",min:0,value:newAssign.total,onChange:e=>setNewAssign(p=>({...p,total:e.target.value})),placeholder:"0",style:inp})
        )
      ),
      React.createElement("div",{style:{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}},
        React.createElement("button",{style:btnG,onClick:closeModal},"Ləğv et"),
        React.createElement("button",{style:btnP,onClick:doCreateAssign},"Yarat")
      )
    ),

    // Add Role
    React.createElement(Modal,{open:modal==="addRole",onClose:closeModal,title:"Yeni Rol",t,wide:true},
      React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:4}},
        React.createElement(Field,{label:"Rol adı",error:formErrors.roleName},
          React.createElement("input",{value:newRole.name,onChange:e=>{
            const v=e.target.value;
            setNewRole(p=>({...p,name:v,slug:slugify(v)}));
          },placeholder:"Məs: Dekan",style:formErrors.roleName?inpErr:inp})
        ),
        React.createElement(Field,{label:"Slug",error:formErrors.roleSlug},
          React.createElement("input",{value:newRole.slug,onChange:e=>setNewRole(p=>({...p,slug:e.target.value})),placeholder:"dean",style:formErrors.roleSlug?inpErr:inp})
        )
      ),
      React.createElement("label",{style:{fontSize:"0.78rem",fontWeight:600,color:t.textSec,display:"block",marginBottom:8}},"İcazələr"),
      React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:18}},
        ALL_PERMS.map(p=>React.createElement("label",{key:p,style:{display:"flex",alignItems:"center",gap:6,padding:"8px 10px",borderRadius:8,background:t.bgInput,cursor:"pointer",fontSize:"0.82rem",color:t.text}},
          React.createElement("input",{type:"checkbox",checked:newRole.perms.includes(p),
            onChange:e=>setNewRole(r=>({...r,perms:e.target.checked?[...r.perms,p]:r.perms.filter(x=>x!==p)})),
            style:{accentColor:t.accent}
          }),p
        ))
      ),
      React.createElement("div",{style:{display:"flex",gap:10,justifyContent:"flex-end"}},
        React.createElement("button",{style:btnG,onClick:closeModal},"Ləğv et"),
        React.createElement("button",{style:btnP,onClick:doCreateRole},"Yarat")
      )
    ),

    // Add Notification — FIX BUG-004
    React.createElement(Modal,{open:modal==="addNotif",onClose:closeModal,title:"Yeni Bildiriş",t},
      React.createElement(Field,{label:"Başlıq",error:formErrors.notifTitle},
        React.createElement("input",{value:newNotif.title,onChange:e=>setNewNotif(p=>({...p,title:e.target.value})),placeholder:"Bildiriş başlığı",style:formErrors.notifTitle?inpErr:inp})
      ),
      React.createElement(Field,{label:"Mətn",error:formErrors.notifMsg},
        React.createElement("textarea",{value:newNotif.msg,onChange:e=>setNewNotif(p=>({...p,msg:e.target.value})),placeholder:"Bildiriş mətni...",rows:4,style:{...formErrors.notifMsg?inpErr:inp,resize:"vertical"}})
      ),
      React.createElement(Field,{label:"Hədəf auditoriya"},
        React.createElement("select",{value:newNotif.aud,onChange:e=>setNewNotif(p=>({...p,aud:e.target.value})),style:inp},
          React.createElement("option",{value:"all"},"Hamı"),
          React.createElement("option",{value:"students"},"Tələbələr"),
          React.createElement("option",{value:"teachers"},"Müəllimlər")
        )
      ),
      React.createElement("div",{style:{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}},
        React.createElement("button",{style:btnG,onClick:closeModal},"Ləğv et"),
        React.createElement("button",{style:btnP,onClick:doCreateNotif},"Göndər")
      )
    ),

    // FIX BUG-020: Confirmation Dialog
    React.createElement(ConfirmDialog,{
      open:!!confirm,
      message:confirm?.message,
      onConfirm:confirm?.onConfirm||(() =>{}),
      onCancel:()=>setConfirm(null),
      t
    }),

    // Toast — FIX BUG-018: managed via ref
    toast&&React.createElement("div",{role:"alert","aria-live":"polite",style:{position:"fixed",bottom:24,right:24,zIndex:99999,background:toast.type==="success"?t.success:toast.type==="error"?t.danger:t.accent,color:"#fff",padding:"14px 24px",borderRadius:12,fontSize:"0.88rem",fontWeight:600,boxShadow:"0 8px 30px rgba(0,0,0,0.15)",animation:"slideUp 0.3s ease",maxWidth:340}},
      toast.type==="success"?"✓ ":"✕ ",toast.msg
    )
  );
}

// FIX BUG-017: use createRoot instead of deprecated ReactDOM.render
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(AdminPanel));
</script>
</body>
</html>
