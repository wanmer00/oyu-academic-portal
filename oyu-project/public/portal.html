  // ─────────── STUDENT ───────────
  // ═══ HOME: "My university today" — каждый блок грузится независимо, со своим skeleton / error / empty ═══
  function skeletonRows(n) { return Array.from({ length: n || 3 }, () => '<div class="skel" style="height:42px;margin:8px 0"></div>').join(''); }
  function panelError(retryFn) {
    const id = 'retry-' + Math.random().toString(36).slice(2, 8);
    setTimeout(() => { const b = document.getElementById(id); if (b) b.addEventListener('click', retryFn); }, 0);
    return '<div class="empty" style="color:var(--danger)">' + esc(AP.i18n.t('home.load_error')) +
      '<div style="margin-top:10px"><button class="btn btn-outline btn-sm" id="' + id + '">' + esc(AP.i18n.t('notif.retry')) + '</button></div></div>';
  }
  // academicStanding считает backend (/me/academic-summary); здесь только отображение
  function standingView(code) {
    const t = AP.i18n.t;
    const M = { EXCELLENT: ['home.standing_excellent', 'badge-success'], GOOD: ['home.standing_good', 'badge-info'], SATISFACTORY: ['home.standing_ok', 'badge-warning'], AT_RISK: ['home.standing_risk', 'badge-danger'] };
    const m = M[code] || ['home.standing_none', 'badge-gray'];
    return { label: t(m[0]), cls: m[1] };
  }
  function toMinutes(hhmm) { const [h, m] = String(hhmm).split(':').map(Number); return h * 60 + (m || 0); }

  function renderHomeQuickActions() {
    const t = AP.i18n.t;
    const qa = [
      { page: 's-grades',      icon: ic('grades'),    label: t('home.qa_grades') },
      { page: 's-schedule',    icon: ic('schedule'),  label: t('home.qa_schedule') },
      { page: 's-assignments', icon: ic('clipboard'), label: t('home.qa_assignments') },
      { page: 's-transcript',  icon: ic('doc'),       label: t('home.qa_transcript') },
      { page: 's-requests',    icon: ic('mail'),      label: t('home.qa_request'), openNew: true },
    ];
    const box = document.getElementById('home-qa');
    box.innerHTML = qa.map((q, i) => '<button class="qa-btn" data-qa="' + i + '">' + q.icon + '<span>' + esc(q.label) + '</span></button>').join('');
    box.querySelectorAll('[data-qa]').forEach(b => b.addEventListener('click', async () => {
      const q = qa[Number(b.dataset.qa)];
      await showPage(q.page);
      if (q.openNew) { const nb = document.getElementById('btn-new-request'); if (nb) nb.click(); }
    }));
  }

  async function loadStudentDashboard() {
    const t = AP.i18n.t;
    const now = new Date();
    const nameParts = String(currentUser.fullName || '').split(' ').filter(Boolean);
    document.getElementById('home-hello').textContent = t('home.hello') + ', ' + nameParts.slice(0, 2).join(' ');
    document.getElementById('home-date').textContent = now.toLocaleDateString(localeFor(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    renderHomeQuickActions();

    const skel = { 's-stats': '', 's-today': skeletonRows(3), 's-assignments': skeletonRows(3), 's-announcements': skeletonRows(3), 's-recent-grades': skeletonRows(3) };
    for (const [id, html] of Object.entries(skel)) document.getElementById(id).innerHTML = html;
    document.getElementById('s-stats').innerHTML = '<div class="skel" style="height:110px"></div>'.repeat(4);
    AP.appeals.dashboardAlert(document.getElementById('s-exam-alerts')); // «результат экзамена доступен» + Review / Appeal

    const retry = () => loadStudentDashboard();
    const [rTr, rAtt, rSched, rAsg, rAnn, rGr] = await Promise.allSettled([
      AP.api.myAcademicSummary(), AP.api.journal.attendance.student(), AP.api.mySchedule(),
      AP.api.myAssignments(), AP.api.myAnnouncements(), AP.api.myGrades(),
    ]);

    // ── Academic summary ──
    let gpaVal = '—', creditsVal = '—', standing = standingView('NONE');
    if (rTr.status === 'fulfilled') {
      const s = rTr.value;
      if (s.cumulativeGpa != null) gpaVal = s.cumulativeGpa.toFixed(2);
      creditsVal = s.earnedCredits + ' / ' + s.totalCredits;
      standing = standingView(s.academicStanding);
    }
    let attVal = '—';
    if (rAtt.status === 'fulfilled') {
      const rate = rAtt.value.totals.rate;
      attVal = rate != null ? rate + '%' : '—';
    }
    const card = (icon, val, label, sub, page) =>
      '<div class="stat-card" data-goto="' + page + '" style="cursor:pointer" role="button" tabindex="0"><div class="stat-icon" style="background:#dbeafe;color:#1e40af">' + icon + '</div>' +
      '<div class="stat-val">' + val + '</div><div class="stat-label">' + esc(label) + '</div>' + (sub ? '<div style="margin-top:6px;font-size:11px;color:var(--muted)">' + sub + '</div>' : '') + '</div>';
    document.getElementById('s-stats').innerHTML =
      card('📊', esc(gpaVal), t('home.gpa'), '', 's-transcript') +
      card('✅', esc(attVal), t('home.attendance'), '', 's-attendance') +
      card('🎓', esc(creditsVal), t('home.credits'), esc(t('home.credits_of')), 's-transcript') +
      card('🏅', '<span class="badge ' + standing.cls + '" style="font-size:13px;padding:4px 10px">' + esc(standing.label) + '</span>', t('home.standing'), '', 's-transcript');
    document.querySelectorAll('#s-stats [data-goto]').forEach(el => {
      const go = () => showPage(el.dataset.goto);
      el.addEventListener('click', go);
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });

    // ── Today's classes ──
    const todayBox = document.getElementById('s-today');
    if (rSched.status !== 'fulfilled') todayBox.innerHTML = panelError(retry);
    else {
      const { slots, currentWeekParity } = rSched.value;
      const dow = now.getDay() || 7;
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const todays = slots.filter(s => s.dayOfWeek === dow && (s.weekParity === 'BOTH' || s.weekParity === currentWeekParity))
        .sort((a, b) => a.startTime.localeCompare(b.startTime));
      todayBox.innerHTML = todays.length ? todays.map(s => {
        const st = nowMin >= toMinutes(s.endTime) ? { k: 'status_done', c: 'badge-gray' }
          : nowMin >= toMinutes(s.startTime) ? { k: 'status_now', c: 'badge-success' } : { k: 'status_next', c: 'badge-info' };
        return '<div class="home-row"><div style="min-width:0"><div class="t">' + esc(s.subject.name) + '</div>' +
          '<div class="s">' + esc(s.startTime) + '–' + esc(s.endTime) + (s.teacher ? ' · ' + esc(s.teacher.fullName) : '') + ' · 🏛 ' + esc(s.room) + '</div></div>' +
          '<span class="badge ' + st.c + '">' + esc(t('home.' + st.k)) + '</span></div>';
      }).join('') : '<div class="empty">' + esc(t('dashboard.no_classes_today')) + '</div>';
    }

    // ── Assignments ──
    const asgBox = document.getElementById('s-assignments');
    if (rAsg.status !== 'fulfilled') asgBox.innerHTML = panelError(retry);
    else {
      const done = [], overdue = [], upcoming = [];
      for (const a of rAsg.value) {
        const submitted = a.submission && a.submission.status && a.submission.status !== 'PENDING';
        if (submitted) done.push(a);
        else if (new Date(a.dueDate) < now) overdue.push(a);
        else upcoming.push(a);
      }
      overdue.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
      upcoming.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
      const list = overdue.slice(0, 3).map(a => [a, true]).concat(upcoming.slice(0, 5 - Math.min(3, overdue.length)).map(a => [a, false]));
      asgBox.innerHTML =
        '<div class="pill-group"><span class="pill pill-info">' + esc(t('home.upcoming')) + ': ' + upcoming.length + '</span>' +
        '<span class="pill pill-danger">' + esc(t('home.overdue')) + ': ' + overdue.length + '</span>' +
        '<span class="pill pill-ok">' + esc(t('home.completed')) + ': ' + done.length + '</span></div>' +
        (list.length ? list.map(([a, late]) =>
          '<div class="home-row"><div style="min-width:0"><div class="t">' + esc(a.title) + '</div><div class="s">' + esc(a.subject.name) + '</div></div>' +
          '<span class="badge ' + (late ? 'badge-danger' : 'badge-warning') + '" title="' + esc(t('home.deadline')) + '">' + esc(fmtDate(a.dueDate)) + '</span></div>'
        ).join('') : '<div class="empty">' + esc(t('home.no_assignments')) + '</div>');
    }

    // ── Announcements ──
    const annBox = document.getElementById('s-announcements');
    if (rAnn.status !== 'fulfilled') annBox.innerHTML = panelError(retry);
    else {
      const latest = rAnn.value.slice(0, 3);
      const prioCls = { LOW: 'badge-gray', NORMAL: 'badge-info', HIGH: 'badge-warning', URGENT: 'badge-danger' };
      annBox.innerHTML = latest.length ? latest.map(a =>
        '<div class="home-row" data-goto="announcements" style="cursor:pointer"><div style="min-width:0"><div class="t">' + (a.isRead ? '' : '<span class="badge badge-danger" style="margin-right:6px">' + esc(t('home.new')) + '</span>') + esc(a.title) + '</div>' +
        '<div class="s">' + esc(fmtDate(a.createdAt)) + '</div></div>' +
        '<span class="badge ' + (prioCls[a.priority] || 'badge-gray') + '">' + esc(t('home.prio.' + a.priority, a.priority)) + '</span></div>'
      ).join('') : '<div class="empty">' + esc(t('home.no_announcements')) + '</div>';
      annBox.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => showPage('announcements')));
    }

    // ── Recent grades ──
    const grBox = document.getElementById('s-recent-grades');
    if (rGr.status !== 'fulfilled') grBox.innerHTML = panelError(retry);
    else {
      const recent = rGr.value.slice(0, 5);
      grBox.innerHTML = recent.length ? recent.map(g => { const c = gradeColor(g.maxValue ? (Number(g.value) / Number(g.maxValue)) * 100 : Number(g.value));
        return '<div class="home-row"><div style="min-width:0"><div class="t">' + esc(g.subject.name) + '</div><div class="s">' + esc(g.subject.code) + ' · ' + esc(fmtDate(g.createdAt)) + '</div></div><span class="badge" style="background:' + c.bg + ';color:' + c.c + '">' + Number(g.value).toFixed(1) + (g.maxValue ? ' / ' + Number(g.maxValue) : '') + '</span></div>';
      }).join('') : '<div class="empty">' + esc(t('grades.no_grades')) + '</div>';
    }
  }

  let scheduleView = { mode: 'week', year: new Date().getFullYear(), month: new Date().getMonth(), weekOffset: 0 };
  let scheduleCache = null;
  let scheduleEventsCache = null;
  let scheduleAssignmentsCache = null;

  // Color legend for schedule item types
  const SCHED_COLORS = {
    lecture:    { bg: '#dbeafe', c: '#1e40af', label: 'Mühazirə',     icon: '🎓' },
    seminar:    { bg: '#ede9fe', c: '#5b21b6', label: 'Seminar',      icon: '💡' },
    lab:        { bg: '#cffafe', c: '#0e7490', label: 'Laboratoriya', icon: '🧪' },
    exam:       { bg: '#fee2e2', c: '#991b1b', label: 'İmtahan',      icon: '📝' },
    midterm:    { bg: '#fed7aa', c: '#9a3412', label: 'Midterm',      icon: '⚡' },
    final:      { bg: '#fecaca', c: '#7f1d1d', label: 'Final',        icon: '🏁' },
    deadline:   { bg: '#fef3c7', c: '#92400e', label: 'Dedline (tapşırıq)', icon: '⏰' },
    holiday:    { bg: '#d1fae5', c: '#065f46', label: 'Bayram',       icon: '🎌' },
    mourning:   { bg: '#e5e7eb', c: '#1f2937', label: 'Hüzn günü',    icon: '🕯' },
    cancelled:  { bg: '#fef3c7', c: '#92400e', label: 'Təxirə salındı',icon: '⛔' },
  };

  async function loadStudentSchedule() {
    if (!scheduleCache) scheduleCache = await AP.api.mySchedule();
    try { if (!scheduleEventsCache) scheduleEventsCache = await AP.api.myCalendar(); } catch { scheduleEventsCache = []; }
    try { if (!scheduleAssignmentsCache) scheduleAssignmentsCache = await AP.api.myAssignments(); } catch { scheduleAssignmentsCache = []; }
    renderStudentSchedule();
  }

  function legendHtml() {
    const items = ['lecture', 'seminar', 'exam', 'midterm', 'final', 'deadline', 'holiday', 'mourning'];
    return '<div style="display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;background:#f8fafc;border-radius:10px;margin-bottom:14px;font-size:12px">' +
      items.map(k => { const c = SCHED_COLORS[k]; return '<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:' + c.bg + ';color:' + c.c + ';border-radius:6px;font-weight:600">' + c.icon + ' ' + esc(c.label) + '</span>'; }).join('') +
    '</div>';
  }

  function inferExamType(ev) {
    if (!ev) return null;
    if (ev.type === 'HOLIDAY')   return 'holiday';
    if (ev.type === 'MOURNING')  return 'mourning';
    if (ev.type === 'LECTURE_CANCELLED') return 'cancelled';
    if (ev.type === 'EXAM') {
      const t = (ev.title || '').toLowerCase();
      if (t.includes('midterm') || t.includes('ara')) return 'midterm';
      if (t.includes('final'))   return 'final';
      return 'exam';
    }
    return null;
  }

  function renderStudentSchedule() {
    const box = document.getElementById('s-schedule');
    const toolbar =
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">' +
        '<div style="display:flex;gap:4px;background:#f1f5f9;border-radius:10px;padding:4px">' +
          '<button class="filter-btn ' + (scheduleView.mode === 'week' ? 'active' : '') + '" data-sched-mode="week">🗓 Həftə</button>' +
          '<button class="filter-btn ' + (scheduleView.mode === 'month' ? 'active' : '') + '" data-sched-mode="month">📅 Ay</button>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-items:center">' +
          '<button class="btn btn-outline btn-sm" data-sched-nav="-1">←</button>' +
          '<button class="btn btn-primary btn-sm" data-sched-nav="0">' + (AP.i18n.getLang() === 'ru' ? 'Сегодня' : AP.i18n.getLang() === 'en' ? 'Today' : 'Bu gün') + '</button>' +
          '<button class="btn btn-outline btn-sm" data-sched-nav="1">→</button>' +
          '<span id="sched-period" style="font-size:14px;font-weight:600;min-width:180px;text-align:center"></span>' +
        '</div>' +
      '</div>';
    box.innerHTML = toolbar + legendHtml() + '<div id="sched-content"></div>';
    document.querySelectorAll('[data-sched-mode]').forEach(b => b.addEventListener('click', () => {
      scheduleView.mode = b.dataset.schedMode;
      scheduleView.weekOffset = 0;
      scheduleView.year = new Date().getFullYear();
      scheduleView.month = new Date().getMonth();
      renderStudentSchedule();
    }));
    document.querySelectorAll('[data-sched-nav]').forEach(b => b.addEventListener('click', () => {
      const dir = parseInt(b.dataset.schedNav, 10);
      if (dir === 0) { scheduleView.weekOffset = 0; scheduleView.year = new Date().getFullYear(); scheduleView.month = new Date().getMonth(); }
      else if (scheduleView.mode === 'week') scheduleView.weekOffset += dir;
      else { scheduleView.month += dir; if (scheduleView.month < 0) { scheduleView.month = 11; scheduleView.year--; } if (scheduleView.month > 11) { scheduleView.month = 0; scheduleView.year++; } }
      renderStudentSchedule();
    }));

    if (scheduleView.mode === 'week') renderScheduleWeek();
    else renderScheduleMonth();
  }

  function getWeekStart(date) {
    const d = new Date(date);
    const day = d.getDay() || 7;
    d.setDate(d.getDate() - (day - 1));
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function weekParityAt(date) {
    const t = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    const wk = Math.ceil(((t.getTime() - yearStart.getTime()) / 86400000 + 1) / 7);
    return wk % 2 === 1 ? 'UPPER' : 'LOWER';
  }
  function eventForDate(date) {
    const key = date.toISOString().slice(0, 10);
    return (scheduleEventsCache || []).find(e => {
      const s = new Date(e.eventDate).toISOString().slice(0, 10);
      const en = e.endDate ? new Date(e.endDate).toISOString().slice(0, 10) : s;
      return key >= s && key <= en;
    });
  }

  function renderScheduleWeek() {
    const sch = scheduleCache.slots;
    const now = new Date();
    const weekStart = getWeekStart(now);
    weekStart.setDate(weekStart.getDate() + scheduleView.weekOffset * 7);
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 4);
    const parity = weekParityAt(weekStart);
    const parityBadge = (p) => p === 'BOTH' ? '' :
      '<span class="badge ' + (p === 'UPPER' ? 'badge-info' : 'badge-purple') + '" style="font-size:9px;padding:1px 5px;margin-left:3px">' + p + '</span>';

    const fmt = (d) => d.toLocaleDateString(localeFor(), { day: 'numeric', month: 'short' });
    document.getElementById('sched-period').textContent = fmt(weekStart) + ' – ' + fmt(weekEnd) + ' · ' + parity;

    const times = Array.from(new Set(sch.map(s => s.startTime + '|' + s.endTime))).sort();
    let html = '<div class="schedule-grid"><div class="time-head"></div>';
    for (let d = 1; d <= 5; d++) {
      const dayDate = new Date(weekStart); dayDate.setDate(dayDate.getDate() + (d - 1));
      const ev = eventForDate(dayDate);
      const evTag = ev ? '<div style="font-size:9px;background:#fee2e2;color:#991b1b;padding:1px 4px;border-radius:3px;margin-top:2px;font-weight:600">' + esc(ev.type) + '</div>' : '';
      html += '<div class="dow-head">' + esc(AP.i18n.t(DOW[d])) + '<div style="font-size:10px;opacity:.6;font-weight:400">' + esc(fmt(dayDate)) + '</div>' + evTag + '</div>';
    }
    for (const t of times) {
      const [start, end] = t.split('|');
      html += '<div class="time-head" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><div>' + esc(start) + '</div><div style="opacity:.5">' + esc(end) + '</div></div>';
      for (let d = 1; d <= 5; d++) {
        const dayDate = new Date(weekStart); dayDate.setDate(dayDate.getDate() + (d - 1));
        const ev = eventForDate(dayDate);
        const isHoliday = ev && (ev.type === 'HOLIDAY' || ev.type === 'MOURNING' || ev.type === 'LECTURE_CANCELLED');
        const daySlots = sch.filter(s => s.dayOfWeek === d && s.startTime === start && s.endTime === end && (s.weekParity === 'BOTH' || s.weekParity === parity));
        if (daySlots.length === 0 || isHoliday) {
          html += '<div' + (isHoliday ? ' style="background:#fef3c7aa"' : '') + '>' + (isHoliday ? '<div style="font-size:10px;color:#92400e;padding:4px">' + esc(ev.title) + '</div>' : '') + '</div>';
          continue;
        }
        html += '<div>' + daySlots.map(slot => {
          const typeKey = slot.type === 'lab' ? 'lab' : slot.type === 'seminar' ? 'seminar' : slot.type === 'exam' ? 'exam' : 'lecture';
          const tc = SCHED_COLORS[typeKey];
          const teacherBit = slot.teacher ? '<div class="slot-room" style="font-size:10px">' + esc(slot.teacher.fullName.split(' ')[0]) + '</div>' : '';
          return '<div class="slot" data-slot-info="' + esc(JSON.stringify(slot)) + '" style="background:' + tc.bg + ';color:' + tc.c + ';margin:2px 0;padding:6px 8px;border-radius:6px;cursor:pointer;border-left:3px solid ' + tc.c + '">' +
            '<div class="slot-code">' + tc.icon + ' ' + esc(slot.subject.code) + parityBadge(slot.weekParity) + '</div>' +
            '<div style="font-size:11px;color:' + tc.c + ';opacity:.85">' + esc(slot.subject.name) + '</div>' +
            '<div class="slot-room" style="color:' + tc.c + ';opacity:.7">' + esc(slot.room) + ' · ' + esc(slot.type) + '</div>' +
            teacherBit +
          '</div>';
        }).join('') + '</div>';
      }
    }
    html += '</div>';
    document.getElementById('sched-content').innerHTML = html;
  }

  function renderScheduleMonth() {
    const sch = scheduleCache.slots;
    const { year, month } = scheduleView;
    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);
    const daysInMonth = last.getDate();
    const startDow = (first.getDay() || 7) - 1;
    const monthName = first.toLocaleDateString(localeFor(), { month: 'long', year: 'numeric' });
    const today = new Date();
    document.getElementById('sched-period').textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1);

    const dowLabels = ['schedule.monday','schedule.tuesday','schedule.wednesday','schedule.thursday','schedule.friday','schedule.saturday','schedule.sunday'].map(k => AP.i18n.t(k));
    let html = '<div class="card" style="overflow:hidden"><div style="display:grid;grid-template-columns:repeat(7,1fr);background:var(--border);gap:1px">' +
      dowLabels.map(l => '<div style="background:#f8fafc;padding:8px;text-align:center;font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">' + esc(l) + '</div>').join('');

    for (let i = 0; i < startDow; i++) html += '<div style="background:#f8fafc;min-height:92px"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const dateObj = new Date(year, month, d);
      const dow = dateObj.getDay() || 7;
      const parity = weekParityAt(dateObj);
      const ev = eventForDate(dateObj);
      const evKey = inferExamType(ev);
      const slotsToday = sch.filter(s => s.dayOfWeek === dow && (s.weekParity === 'BOTH' || s.weekParity === parity)).sort((a,b) => a.startTime.localeCompare(b.startTime));
      const dateKey = dateObj.toISOString().slice(0, 10);
      const deadlines = (scheduleAssignmentsCache || []).filter(a => new Date(a.dueDate).toISOString().slice(0, 10) === dateKey);
      const isToday = dateObj.toDateString() === today.toDateString();
      const bg = evKey && SCHED_COLORS[evKey] ? SCHED_COLORS[evKey].bg + 'aa' : (isToday ? '#eff6ff' : '#fff');

      let cellHtml = '<div style="font-weight:700;font-size:13px">' + d + '</div>';

      // Calendar event (holiday/mourning/exam/midterm/final)
      if (ev && evKey) {
        const c = SCHED_COLORS[evKey];
        cellHtml += '<div style="background:' + c.bg + ';color:' + c.c + ';padding:2px 5px;margin-top:3px;border-radius:4px;font-size:10px;font-weight:700" title="' + esc(ev.title) + '">' + c.icon + ' ' + esc(c.label) + '</div>';
      } else {
        // Classes (max 2 visible)
        cellHtml += slotsToday.slice(0, 2).map(s => {
          const tk = s.type === 'lab' ? 'lab' : s.type === 'seminar' ? 'seminar' : 'lecture';
          const tc = SCHED_COLORS[tk];
          return '<div style="background:' + tc.bg + ';color:' + tc.c + ';padding:1px 5px;margin-top:2px;border-radius:4px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(s.subject.name) + ' · ' + esc(s.startTime) + '-' + esc(s.endTime) + '">' + tc.icon + ' <b>' + esc(s.startTime) + '</b> ' + esc(s.subject.code) + '</div>';
        }).join('');
        if (slotsToday.length > 2) cellHtml += '<div style="font-size:10px;color:var(--muted);margin-top:2px">+' + (slotsToday.length - 2) + ' ' + esc(AP.i18n.t('schedule.lecture').toLowerCase()) + '</div>';
      }

      // Assignment deadlines (always, even on event days)
      if (deadlines.length) {
        const dc = SCHED_COLORS.deadline;
        cellHtml += '<div style="background:' + dc.bg + ';color:' + dc.c + ';padding:1px 5px;margin-top:2px;border-radius:4px;font-size:10px;font-weight:700" title="' + deadlines.map(x => esc(x.title)).join(' · ') + '">' + dc.icon + ' ' + deadlines.length + ' deadline</div>';
      }

      html += '<div style="background:' + bg + ';padding:6px 8px;min-height:92px;' + (isToday ? 'outline:2px solid #3b82f6;outline-offset:-2px' : '') + '">' + cellHtml + '</div>';
    }
    const used = startDow + daysInMonth;
    const target = used <= 35 ? 35 : 42;
    for (let i = used; i < target; i++) html += '<div style="background:#f8fafc;min-height:92px"></div>';
    html += '</div></div>';
    document.getElementById('sched-content').innerHTML = html;
  }

  // ═══ MY SUBJECTS — всё о предмете на одной странице ═══
  let mySubjectsFilter = { academicYear: '', term: '' };

  async function loadMySubjects() {
    await populateSemesterFilter('ms-filter', mySubjectsFilter.academicYear ? mySubjectsFilter.academicYear + '|' + mySubjectsFilter.term : '');
    const sel = document.getElementById('ms-filter');
    sel.onchange = () => {
      const v = sel.value;
      if (v) { const [ay, tr] = v.split('|'); mySubjectsFilter = { academicYear: ay, term: tr }; }
      else   { mySubjectsFilter = { academicYear: '', term: '' }; }
      renderMySubjects();
    };
    await renderMySubjects();
  }

  async function renderMySubjects() {
    const box = document.getElementById('ms-box');
    box.innerHTML = '<div class="card"><div class="empty">' + esc(AP.i18n.t('common.loading')) + '</div></div>';
    try {
      const filters = mySubjectsFilter.academicYear ? { academicYear: mySubjectsFilter.academicYear, term: mySubjectsFilter.term } : undefined;
      const data = await AP.api.mySubjectsOverview(filters);

      if (!data.subjects.length) {
        box.innerHTML = '<div class="card"><div class="empty">' + esc(AP.i18n.t('grades.no_grades')) + '</div></div>';
        return;
      }

      const headerBadge = data.isCurrent
        ? '<span class="badge badge-info">' + esc(AP.i18n.t('transcript.current_semester')) + '</span>'
        : '<span class="badge badge-gray">' + esc(AP.i18n.t('transcript.archived')) + '</span>';
      const periodTitle = esc(data.academicYear) + ' · ' + esc(AP.i18n.t('transcript.' + String(data.term).toLowerCase(), data.term));

      const attStatusColor = (s) => ({
        OK: '#10b981', WARNING: '#f59e0b', CRITICAL: '#fb923c', EXCEEDED: '#ef4444',
      }[s] || '#64748b');
      const attStatusLabel = (s) => AP.i18n.t('attendance.limit_status_' + s.toLowerCase(), s);

      box.innerHTML =
        '<div class="card" style="margin-bottom:16px"><div class="card-pad" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
          '<div style="font-weight:700;font-size:15px">' + periodTitle + '</div>' + headerBadge +
          '<span style="margin-left:auto;font-size:13px;color:var(--muted)">' + data.subjects.length + ' ' + esc(AP.i18n.t('nav.subjects').toLowerCase()) + '</span>' +
        '</div></div>' +
        data.subjects.map((item) => renderSubjectCard(item, data.isCurrent, attStatusColor, attStatusLabel)).join('');
    } catch (e) {
      box.innerHTML = '<div class="card"><div class="empty" style="color:var(--danger)">' + esc(e.message || 'error') + '</div></div>';
    }
  }

  // Компактная карточка предмета в списке. По клику → детальная страница.
  function renderSubjectCard(item, isCurrent, attStatusColor, attStatusLabel) {
    const s = item.subject;
    const color = s.color || '#2563eb';
    const a = item.attendance;
    const attColor = attStatusColor(a.status);
    // Итог предмета считает backend (Academic Journal): итоговый /100 или текущая успеваемость по имеющимся компонентам
    const jr = item.journal || {};
    const jrPct = jr.total && jr.total.final ? jr.total.score : (jr.performancePct != null ? jr.performancePct : null);
    const avgGrade = jrPct != null ? Number(jrPct).toFixed(1) : '—';
    const gc = jrPct != null ? gradeColor(Number(jrPct)) : { bg: '#f1f5f9', c: '#475569' };
    const teachersLine = item.teachers.length
      ? item.teachers.map(t => esc(t.fullName) + ' (' + esc(t.type) + ')').join(' · ')
      : AP.i18n.t('my_subjects.no_teacher');

    return '<div class="card" style="margin-bottom:12px;border-left:4px solid ' + color + ';cursor:pointer;transition:all .15s" ' +
      'onmouseover="this.style.boxShadow=\'0 4px 12px rgba(0,0,0,.08)\'" ' +
      'onmouseout="this.style.boxShadow=\'\'" ' +
      'data-subject-code="' + esc(s.code) + '">' +
      '<div class="card-pad" style="display:grid;grid-template-columns:minmax(0,2fr) 1fr 1fr auto;gap:16px;align-items:center">' +
        // Name + teachers
        '<div style="min-width:0">' +
          '<div style="font-size:16px;font-weight:700">' + esc(s.code) + ' · ' + esc(s.name) + '</div>' +
          '<div style="font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
            esc(teachersLine) +
          '</div>' +
        '</div>' +
        // Average grade
        '<div style="text-align:center">' +
          '<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">' + esc(AP.i18n.t('grades.value')) + '</div>' +
          '<div style="margin-top:4px"><span class="badge" style="background:' + gc.bg + ';color:' + gc.c + ';font-size:13px;padding:3px 10px">' + avgGrade + '</span></div>' +
        '</div>' +
        // Attendance mini
        '<div>' +
          '<div style="font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px">' +
            '<span>' + esc(AP.i18n.t('attendance.counted')) + '</span>' +
            '<span><b>' + a.countedAbsences + '</b> / ' + a.maxAbsences + '</span>' +
          '</div>' +
          '<div class="prog" style="height:6px"><div class="prog-bar" style="width:' + Math.min(100, a.percentage) + '%;background:' + attColor + '"></div></div>' +
          '<div style="margin-top:4px;font-size:10px;color:' + attColor + ';font-weight:600">' + esc(attStatusLabel(a.status)) + '</div>' +
        '</div>' +
        // Open button
        '<div><button class="btn btn-primary btn-sm">' + esc(AP.i18n.t('materials.open')) + ' →</button></div>' +
      '</div>' +
    '</div>';
  }

  // Клик по компактной карточке → открываем детальный вид
  document.addEventListener('click', (e) => {
    const card = e.target.closest && e.target.closest('[data-subject-code]');
    if (!card) return;
    const code = card.dataset.subjectCode;
    openSubjectDetail(code);
  });

  async function openSubjectDetail(code) {
    currentPage = 's-subject-detail';
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('pg-s-subject-detail').classList.add('active');
    document.getElementById('page-title').textContent = code;
    const box = document.getElementById('sd-box');
    box.innerHTML = '<div class="card"><div class="empty">' + esc(AP.i18n.t('common.loading')) + '</div></div>';
    try {
      const filters = mySubjectsFilter.academicYear ? { academicYear: mySubjectsFilter.academicYear, term: mySubjectsFilter.term } : undefined;
      const data = await AP.api.mySubjectDays(code, filters);
      renderSubjectDetail(data, box);
    } catch (err) {
      box.innerHTML = '<div class="card"><div class="empty" style="color:var(--danger)">' + esc(err.message || 'error') + '</div></div>';
    }
  }

  document.getElementById('sd-back').addEventListener('click', () => {
    currentPage = 's-my-subjects';
    showPage('s-my-subjects');
  });

  function renderSubjectDetail(data, box) {
    const s = data.subject;
    const color = s.color || '#2563eb';
    const sum = data.summary;
    const attColor = sum.status
      ? { OK: '#10b981', WARNING: '#f59e0b', CRITICAL: '#fb923c', EXCEEDED: '#ef4444' }[sum.status]
      : '#10b981';

    document.getElementById('page-title').textContent = s.code + ' · ' + s.name;

    // ── Header card ──
    const teachersHtml = data.teachers.length
      ? data.teachers.map(t => {
          const typeLbl = AP.i18n.t('schedule.' + t.type, t.type);
          const parity = t.weekParity === 'BOTH' ? '' :
            ' <span class="badge ' + (t.weekParity === 'UPPER' ? 'badge-info' : 'badge-purple') + '" style="font-size:10px">' + t.weekParity + '</span>';
          return '<div style="padding:4px 0"><b>' + esc(t.fullName) + '</b> ' +
            '<span class="chip" style="background:' + color + '18;color:' + color + '">' + esc(typeLbl) + '</span>' + parity + '</div>';
        }).join('')
      : '<div style="color:var(--muted)">' + esc(AP.i18n.t('my_subjects.no_teacher')) + '</div>';

    const header =
      '<div class="card" style="margin-bottom:16px;border-left:4px solid ' + color + '"><div class="card-pad">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">' +
          '<div style="min-width:0;flex:1">' +
            '<div style="font-size:20px;font-weight:700">' + esc(s.code) + ' · ' + esc(s.name) + '</div>' +
            '<div style="font-size:13px;color:var(--muted);margin-top:4px">' +
              esc(AP.i18n.t('transcript.semester_num')) + ' ' + s.semester + ' · ' + esc(data.academicYear) + ' ' + esc(AP.i18n.t('transcript.' + String(data.term).toLowerCase(), data.term)) +
            '</div>' +
            (s.description ? '<div style="font-size:13px;color:var(--muted);margin-top:4px">' + esc(s.description) + '</div>' : '') +
            '<div style="margin-top:12px">' + teachersHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</div></div>';

    // ── KPI ──
    const kpiCards =
      '<div class="stat-grid" style="margin-bottom:16px">' +
        statCard('✅', sum.present, AP.i18n.t('attendance.present')) +
        statCard('❌', String(sum.absent) + (sum.late ? ' +' + sum.late + '⏰' : ''), AP.i18n.t('attendance.absent')) +
        statCard('🎌', sum.holidays, AP.i18n.t('my_subjects.holidays', 'Holidays')) +
        statCard('🎯', sum.countedAbsences + ' / ' + sum.maxAbsences, AP.i18n.t('attendance.counted')) +
      '</div>';

    // ── Прогресс-бар лимита ──
    const attBar =
      '<div class="card" style="margin-bottom:16px"><div class="card-pad">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>' + esc(AP.i18n.t('attendance.limits_title')) + '</b>' +
        '<span class="badge" style="background:' + attColor + '22;color:' + attColor + '">' +
          esc(AP.i18n.t('attendance.limit_status_' + String(sum.status).toLowerCase(), sum.status)) +
        '</span></div>' +
        '<div class="prog" style="height:10px"><div class="prog-bar" style="width:' + Math.min(100, sum.percentage) + '%;background:' + attColor + '"></div></div>' +
        '<div style="margin-top:6px;font-size:12px;color:var(--muted)">' +
          esc(AP.i18n.t('attendance.counted')) + ': <b>' + sum.countedAbsences + '</b> / ' + sum.maxAbsences + ' · ' +
          esc(AP.i18n.t('attendance.remaining')) + ': <b>' + sum.remaining + '</b>' +
        '</div>' +
      '</div></div>';

    // ── Таблица дат занятий с attendance + праздники ──
    const daysSorted = [...data.days].reverse(); // от новых к старым
    const eventBg = {
      HOLIDAY: '#d1fae5', MOURNING: '#e5e7eb', EXAM: '#fee2e2',
      LECTURE_CANCELLED: '#fef3c7', ACADEMIC: '#dbeafe', OTHER: '#f1f5f9',
    };
    const eventEmoji = {
      HOLIDAY: '🎌', MOURNING: '🕯', EXAM: '📝',
      LECTURE_CANCELLED: '⛔', ACADEMIC: 'ℹ', OTHER: '📌',
    };
    const attBadge = (st) => {
      if (!st) return '<span class="badge badge-gray">—</span>';
      const cls = st === 'PRESENT' ? 'badge-success' : st === 'EXCUSED' ? 'badge-info' : st === 'LATE' ? 'badge-warning' : 'badge-danger';
      const emoji = st === 'PRESENT' ? '✓' : st === 'LATE' ? '⏰' : st === 'EXCUSED' ? '📋' : '✕';
      return '<span class="badge ' + cls + '">' + emoji + ' ' + esc(AP.i18n.t('attendance.' + st.toLowerCase(), st)) + '</span>';
    };

    const daysTable =
      '<div class="card" style="margin-bottom:16px"><div class="card-pad" style="padding:0">' +
        '<div style="padding:14px 20px;font-weight:700;border-bottom:1px solid var(--border)">' +
          esc(AP.i18n.t('attendance.title')) + ' · <span style="color:var(--muted);font-weight:400;font-size:13px">' + data.days.length + ' ' + esc(AP.i18n.t('schedule.title').toLowerCase()) + '</span>' +
        '</div>' +
        (daysSorted.length ? '<table><thead><tr>' +
          '<th style="padding:10px 16px">' + esc(AP.i18n.t('grades.date')) + '</th>' +
          '<th style="padding:10px 16px">' + esc(AP.i18n.t('admin_schedule.time')) + '</th>' +
          '<th style="padding:10px 16px">' + esc(AP.i18n.t('grades.type')) + '</th>' +
          '<th style="padding:10px 16px">' + esc(AP.i18n.t('admin_schedule.room')) + '</th>' +
          '<th style="padding:10px 16px">' + esc(AP.i18n.t('admin_schedule.teacher')) + '</th>' +
          '<th style="padding:10px 16px">' + esc(AP.i18n.t('common.status')) + '</th>' +
        '</tr></thead><tbody>' +
        daysSorted.map(d => {
          const ev = d.calendarEvent;
          const rowStyle = ev
            ? 'background:' + (eventBg[ev.type] || '#f8fafc') + '77'
            : (!d.isPast ? 'opacity:.55' : '');
          const typeLbl = AP.i18n.t('schedule.' + d.slot.type, d.slot.type);
          const parityBadge = d.slot.weekParity === 'BOTH' ? '' :
            ' <span class="badge ' + (d.slot.weekParity === 'UPPER' ? 'badge-info' : 'badge-purple') + '" style="font-size:10px;padding:1px 5px">' + d.slot.weekParity + '</span>';
          const cell = (ev)
            ? '<span style="color:#1f2937;font-weight:600">' + (eventEmoji[ev.type] || '📌') + ' ' + esc(ev.type) + '</span>' +
              '<div style="font-size:11px;color:var(--muted)">' + esc(ev.title) + '</div>'
            : attBadge(d.attendanceStatus);
          const dow = AP.i18n.t(DOW[d.dayOfWeek] || '');
          return '<tr style="' + rowStyle + '">' +
            '<td style="padding:10px 16px"><b>' + fmtDate(d.date) + '</b><div style="font-size:11px;color:var(--muted)">' + esc(dow) + '</div></td>' +
            '<td style="padding:10px 16px;font-family:Consolas,monospace;font-size:13px">' + esc(d.slot.startTime) + '–' + esc(d.slot.endTime) + '</td>' +
            '<td style="padding:10px 16px"><span class="chip" style="background:' + color + '18;color:' + color + '">' + esc(typeLbl) + '</span>' + parityBadge + '</td>' +
            '<td style="padding:10px 16px">🏛 ' + esc(d.slot.room) + '</td>' +
            '<td style="padding:10px 16px;font-size:12px">' + (d.slot.teacher ? esc(d.slot.teacher.fullName) : '—') + '</td>' +
            '<td style="padding:10px 16px">' + cell + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table>'
        : '<div class="empty">' + esc(AP.i18n.t('grades.no_grades')) + '</div>') +
      '</div></div>';

    // ── Оценки с историей ──
    const gradesTable =
      '<div class="card" style="margin-bottom:16px"><div class="card-pad" style="padding:0">' +
        '<div style="padding:14px 20px;font-weight:700;border-bottom:1px solid var(--border)">' +
          esc(AP.i18n.t('grades.title')) + ' · <span style="color:var(--muted);font-weight:400;font-size:13px">' + data.grades.length + '</span>' +
        '</div>' +
        (data.grades.length ? '<table><thead><tr>' +
          '<th style="padding:10px 16px">' + esc(AP.i18n.t('grades.date')) + '</th>' +
          '<th style="padding:10px 16px">' + esc(AP.i18n.t('grades.type')) + '</th>' +
          '<th style="padding:10px 16px">' + esc(AP.i18n.t('grades.value')) + '</th>' +
          '<th style="padding:10px 16px">' + esc(AP.i18n.t('grades.teacher')) + '</th>' +
          '<th style="padding:10px 16px">' + esc(AP.i18n.t('grades.comment')) + '</th>' +
        '</tr></thead><tbody>' +
        data.grades.map(g => {
          const c = gradeColor(g.maxValue ? (Number(g.value) / Number(g.maxValue)) * 100 : Number(g.value));
          const typeLbl = AP.i18n.t('grades.' + String(g.type).toLowerCase(), g.type);
          const historyHtml = g.history.length
            ? '<div style="font-size:11px;color:var(--muted);margin-top:4px">📜 ' + g.history.length + ' ' + esc(AP.i18n.t('transcript.attempts').toLowerCase()) + ': ' +
              g.history.slice(0, 3).map(h => Number(h.oldValue).toFixed(0) + '→' + Number(h.newValue).toFixed(0)).join(', ') + '</div>'
            : '';
          return '<tr>' +
            '<td style="padding:10px 16px">' + fmtDate(g.createdAt) + '</td>' +
            '<td style="padding:10px 16px"><span class="badge badge-gray">' + esc(typeLbl) + '</span></td>' +
            '<td style="padding:10px 16px"><span class="badge" style="background:' + c.bg + ';color:' + c.c + '">' + Number(g.value).toFixed(1) + (g.maxValue ? ' / ' + Number(g.maxValue) : '') + '</span></td>' +
            '<td style="padding:10px 16px;font-size:12px">' + (g.teacher ? esc(g.teacher.fullName) : '—') + '</td>' +
            '<td style="padding:10px 16px;font-size:12px;color:var(--muted)">' + esc(g.comment || '') + historyHtml + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table>'
        : '<div class="empty">' + esc(AP.i18n.t('grades.no_grades')) + '</div>') +
      '</div></div>';

    // ── Материалы ──
    const materialsCard = data.materials.length
      ? '<div class="card" style="margin-bottom:16px"><div class="card-pad" style="padding:0">' +
          '<div style="padding:14px 20px;font-weight:700;border-bottom:1px solid var(--border)">' + esc(AP.i18n.t('materials.title')) + ' · <span style="color:var(--muted);font-weight:400;font-size:13px">' + data.materials.length + '</span></div>' +
          data.materials.map(m =>
            '<div style="padding:12px 20px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;gap:12px">' +
              '<div><div style="font-weight:600">' + esc(m.title) + '</div>' +
                '<div style="font-size:11px;color:var(--muted);margin-top:2px"><span class="badge badge-gray" style="font-size:10px">' + esc(m.type) + '</span> · ' + fmtDate(m.createdAt) + (m.teacher ? ' · ' + esc(m.teacher) : '') + '</div></div>' +
              (m.url ? '<a class="btn btn-outline btn-sm" href="' + esc(m.url) + '" target="_blank" rel="noopener noreferrer">' + esc(AP.i18n.t('materials.open')) + ' ↗</a>' : '') +
            '</div>'
          ).join('') +
        '</div></div>'
      : '';

    // ── Задания ──
    const assignmentsCard = data.assignments.length
      ? '<div class="card" style="margin-bottom:16px"><div class="card-pad" style="padding:0">' +
          '<div style="padding:14px 20px;font-weight:700;border-bottom:1px solid var(--border)">' + esc(AP.i18n.t('assignments.title')) + ' · <span style="color:var(--muted);font-weight:400;font-size:13px">' + data.assignments.length + '</span></div>' +
          data.assignments.map(asg => {
            const sub = asg.submission;
            const badge = sub && sub.status === 'GRADED'
              ? '<span class="badge badge-success">✓ ' + (sub.grade != null ? Number(sub.grade).toFixed(1) : '') + '</span>'
              : sub
              ? '<span class="badge badge-info">' + esc(AP.i18n.t('assignments.pending')) + '</span>'
              : new Date(asg.dueDate) < new Date()
              ? '<span class="badge badge-danger">' + esc(AP.i18n.t('assignments.overdue')) + '</span>'
              : '<span class="badge badge-gray">—</span>';
            return '<div style="padding:12px 20px;border-bottom:1px solid #f1f5f9">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>' + esc(asg.title) + '</b>' + badge + '</div>' +
              '<div style="font-size:12px;color:var(--muted);margin-top:4px">' + esc(AP.i18n.t('assignments.due_date')) + ': ' + fmtDateTime(asg.dueDate) + (asg.teacher ? ' · ' + esc(asg.teacher.fullName) : '') + '</div>' +
            '</div>';
          }).join('') +
        '</div></div>'
      : '';

    box.innerHTML = header + kpiCards + attBar + daysTable + gradesTable + materialsCard + assignmentsCard;
  }

  async function ensureTranscriptCache() {
    if (!transcriptCache) transcriptCache = await AP.api.myTranscript();
    return transcriptCache;
  }
  function termLabel(t) { return AP.i18n.t('transcript.' + String(t).toLowerCase(), t); }
  function periodLabel(p) {
    return AP.i18n.t('transcript.semester_num') + ' ' + p.semester + ' · ' + esc(p.academicYear) + ' ' + termLabel(p.term);
  }
  async function populateSemesterFilter(selectId, current) {
    const sel = document.getElementById(selectId);
    const trans = await ensureTranscriptCache();
    const existing = new Set();
    const opts = ['<option value="">' + esc(AP.i18n.t('filters.all_semesters')) + '</option>'];
    for (const p of trans.periods.slice().reverse()) {
      const val = p.academicYear + '|' + p.term;
      if (existing.has(val)) continue;
      existing.add(val);
      opts.push('<option value="' + esc(val) + '"' + (current === val ? ' selected' : '') + '>' + periodLabel(p) + '</option>');
    }
    sel.innerHTML = opts.join('');
  }

  async function loadStudentTranscript() {
    transcriptCache = await AP.api.myTranscript();
    const trans = transcriptCache;
    const s = trans.summary;
    document.getElementById('transcript-summary').innerHTML =
      statCard('🎓', s.cumulativeGPA.toFixed(2), AP.i18n.t('transcript.cumulative_gpa')) +
      statCard('📚', String(s.totalSubjects), AP.i18n.t('transcript.subjects_total')) +
      statCard('📅', String(s.semestersCompleted) + ' / ' + trans.student.currentSemester, AP.i18n.t('transcript.semesters_completed'));

    const box = document.getElementById('transcript-periods');
    if (!trans.periods.length) { box.innerHTML = '<div class="card"><div class="empty">' + esc(AP.i18n.t('grades.no_grades')) + '</div></div>'; return; }

    // Отображаем от текущего к самому раннему
    const sorted = trans.periods.slice().reverse();
    box.innerHTML = sorted.map(p => {
      const isCurrent = p.semester === trans.student.currentSemester;
      const tag = isCurrent
        ? '<span class="badge badge-info" style="margin-left:8px">' + esc(AP.i18n.t('transcript.current_semester')) + '</span>'
        : '<span class="badge badge-gray" style="margin-left:8px">' + esc(AP.i18n.t('transcript.archived')) + '</span>';
      const rows = p.subjects.map(x => {
        const c = gradeColor(x.finalValue);
        return '<tr>' +
          '<td><b>' + esc(x.subject.code) + '</b> · ' + esc(x.subject.name) + '</td>' +
          '<td style="text-align:center"><span class="badge" style="background:' + c.bg + ';color:' + c.c + '">' + x.finalValue.toFixed(1) + '</span></td>' +
          '<td style="text-align:center;font-weight:700">' + esc(x.letter) + '</td>' +
          '<td style="text-align:center">' + x.gradePoints.toFixed(1) + '</td>' +
          '<td style="text-align:center">' + (x.hasFinal ? '<span class="badge badge-success">' + esc(AP.i18n.t('transcript.final')) + '</span>' : '<span class="badge badge-warning">' + esc(AP.i18n.t('transcript.attempts')) + ': ' + x.attemptsCount + '</span>') + '</td>' +
          '</tr>';
      }).join('');
      // Незавершённые предметы (ещё нет итога по Academic Journal) — не входят в GPA
      const ipRows = (p.inProgress || []).map(x => '<tr style="opacity:.8"><td><b>' + esc(x.subject.code) + '</b> · ' + esc(x.subject.name) + '</td><td style="text-align:center"><span class="badge badge-gray">' + Number(x.provisionalTotal).toFixed(1) + '</span></td><td style="text-align:center">—</td><td style="text-align:center">—</td><td style="text-align:center"><span class="badge badge-warning">' + esc(AP.i18n.t('journal.provisional')) + '</span> <small>' + x.seminarAnswers + '/' + x.seminarRequired + '</small></td></tr>').join('');
      return '<div class="card" style="margin-bottom:16px"><div class="card-pad">' +

  async function loadStudentAssignments() {
    const items = await AP.api.myAssignments();
    const body = document.getElementById('s-assign-body'); const empty = document.getElementById('s-assign-empty');
    if (!items.length) { body.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    body.innerHTML = items.map(a => {
      const sub = a.submission;
      const overdue = !sub && new Date(a.dueDate) < new Date();
      let statusHtml;
      if (sub && sub.status === 'GRADED') statusHtml = '<span class="badge badge-success">' + esc(AP.i18n.t('assignments.graded')) + '</span>';
      else if (sub && sub.status === 'LATE') statusHtml = '<span class="badge badge-warning">' + esc(AP.i18n.t('assignments.late')) + '</span>';
      else if (sub) statusHtml = '<span class="badge badge-info">' + esc(AP.i18n.t('assignments.pending')) + '</span>';
      else if (overdue) statusHtml = '<span class="badge badge-danger">' + esc(AP.i18n.t('assignments.overdue')) + '</span>';
      else statusHtml = '<span class="badge badge-gray">—</span>';

      const grade = sub && sub.grade != null
        ? (function () { const c = gradeColor(Number(sub.grade)); return '<span class="badge" style="background:' + c.bg + ';color:' + c.c + '">' + Number(sub.grade).toFixed(1) + '</span>'; })()
        : '—';
      const btn = !sub || sub.status !== 'GRADED'
        ? '<button class="btn btn-primary btn-sm" data-submit="' + esc(a.id) + '">' + esc(AP.i18n.t('assignments.submit')) + '</button>'
        : '';
      return '<tr style="cursor:pointer" data-assignment-detail="' + esc(JSON.stringify(a)) + '"><td><b>' + esc(a.subject.code) + '</b> · ' + esc(a.subject.name) + '</td><td><div style="font-weight:600">' + esc(a.title) + '</div><div style="color:var(--muted);font-size:12px">' + esc(a.description.slice(0, 120)) + '</div></td><td>' + fmtDateTime(a.dueDate) + '</td><td>' + statusHtml + '</td><td>' + grade + '</td><td>' + btn + '</td></tr>';
    }).join('');
    body.querySelectorAll('[data-submit]').forEach(b => b.addEventListener('click', () => {
      document.getElementById('sf-id').value = b.dataset.submit;
      document.getElementById('sf-file').value = '';
      document.getElementById('sf-notes').value = '';
      openModal('submit-modal');
    }));
  }

  // ═══ STUDENT: LIBRARY (все материалы по всем предметам + фильтр + поиск) ═══
  let libFilter = { type: 'all', q: '' };
  async function loadStudentLibrary() {
    const box = document.getElementById('lib-box');
    box.innerHTML = '<div class="card"><div class="empty">' + esc(AP.i18n.t('common.loading')) + '</div></div>';
    try {
      const items = await AP.api.myMaterials();
      renderLibrary(items);
      document.getElementById('lib-search').oninput = (e) => { libFilter.q = e.target.value.trim().toLowerCase(); renderLibrary(items); };
      document.querySelectorAll('[data-lib-filter]').forEach(b => b.onclick = () => {
        document.querySelectorAll('[data-lib-filter]').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        libFilter.type = b.dataset.libFilter;
        renderLibrary(items);
      });
    } catch (e) {
      box.innerHTML = '<div class="card"><div class="empty" style="color:var(--danger)">' + esc(e.message || 'error') + '</div></div>';
    }
  }
  function renderLibrary(items) {
    const box = document.getElementById('lib-box');
    const filtered = items.filter(m => {
      if (libFilter.type !== 'all' && m.type !== libFilter.type) return false;
      if (libFilter.q && !(m.title.toLowerCase().includes(libFilter.q) || m.subject.name.toLowerCase().includes(libFilter.q) || m.subject.code.toLowerCase().includes(libFilter.q))) return false;
      return true;
    });
    if (!filtered.length) { box.innerHTML = '<div class="card"><div class="empty">' + esc(AP.i18n.t('materials.no_materials')) + '</div></div>'; return; }
    const bySubject = {};
    for (const m of filtered) { (bySubject[m.subject.code] = bySubject[m.subject.code] || { subject: m.subject, items: [] }).items.push(m); }
    box.innerHTML = Object.values(bySubject).map(g => {
      return '<div class="card" style="margin-bottom:16px;border-left:4px solid ' + (g.subject.color || '#2563eb') + '"><div class="card-pad">' +
        '<div class="card-title"><b>' + esc(g.subject.code) + '</b> · ' + esc(g.subject.name) + ' <span class="badge badge-gray" style="font-size:11px">' + g.items.length + '</span></div>' +
        g.items.map(m => '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;gap:12px">' +
          '<div><div style="font-weight:600">' + esc(m.title) + '</div>' +
          '<div style="color:var(--muted);font-size:12px"><span class="badge badge-gray" style="font-size:10px">' + esc(m.type) + '</span> · ' + fmtDate(m.createdAt) + (m.teacher && m.teacher.user ? ' · ' + esc(m.teacher.user.fullName) : '') + '</div></div>' +
          (m.url ? '<a class="btn btn-outline btn-sm" href="' + esc(m.url) + '" target="_blank" rel="noopener noreferrer">' + esc(AP.i18n.t('materials.open')) + ' ↗</a>' : '<span class="badge badge-gray">' + esc(m.fileName || '—') + '</span>') + '</div>').join('') +
        '</div></div>';
    }).join('');
  }

      });

    }

  async function loadCalendar(boxId) {

  function calendarTypeColor(t) {
    return ({
      HOLIDAY:           { bg: '#d1fae5', c: '#065f46' },
      MOURNING:          { bg: '#e5e7eb', c: '#1f2937' },
      EXAM:              { bg: '#fee2e2', c: '#991b1b' },
      LECTURE_CANCELLED: { bg: '#fef3c7', c: '#92400e' },
      ACADEMIC:          { bg: '#dbeafe', c: '#1e40af' },
      OTHER:             { bg: '#f1f5f9', c: '#475569' },
    }[t] || { bg: '#f1f5f9', c: '#475569' });
  }

  function renderCalendarMonth(box) {
    const { year, month, events } = calendarState;
    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);
    const daysInMonth = last.getDate();
    const startDow = (first.getDay() || 7) - 1; // 0=Mon
    const monthName = first.toLocaleDateString(localeFor(), { month: 'long', year: 'numeric' });
    const today = new Date();
    const isToday = (d) =>
      d.getFullYear() === today.getFullYear() &&
      d.getMonth() === today.getMonth() &&
      d.getDate() === today.getDate();

    // events covering a given day (handles multi-day via endDate)
    function eventsForDay(d) {
      const ds = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      return events.filter((e) => {
        const s = new Date(e.eventDate);
        const ed = e.endDate ? new Date(e.endDate) : s;
        const s0 = new Date(s.getFullYear(), s.getMonth(), s.getDate());
        const e0 = new Date(ed.getFullYear(), ed.getMonth(), ed.getDate());
        return ds >= s0 && ds <= e0;
      });
    }

    const dowLabels = [
      AP.i18n.t('schedule.monday'),
      AP.i18n.t('schedule.tuesday'),
      AP.i18n.t('schedule.wednesday'),
      AP.i18n.t('schedule.thursday'),
      AP.i18n.t('schedule.friday'),
      AP.i18n.t('schedule.saturday'),
      AP.i18n.t('schedule.sunday'),
    ];

    let cellsHtml = '';
    for (let i = 0; i < startDow; i++) cellsHtml += '<div style="background:#f8fafc;min-height:90px"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(year, month, d);
      const evts = eventsForDay(date);
      const todayStyle = isToday(date) ? 'background:#eff6ff' : 'background:#fff';
      const dayEvents = evts.map((ev) => {
        const c = calendarTypeColor(ev.type);
        const time = ev.startTime ? esc(ev.startTime) + ' ' : '';
        const room = ev.roomCode ? ' · 🏛' + esc(ev.roomCode) : '';
        return '<div style="background:' + c.bg + ';color:' + c.c + ';padding:2px 6px;margin-top:3px;border-radius:4px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(ev.title) + (ev.description ? ' — ' + esc(ev.description) : '') + '">' +
          time + esc(ev.title) + room + '</div>';
      }).join('');
      cellsHtml += '<div style="' + todayStyle + ';padding:6px 8px;min-height:90px;border-top:1px solid var(--border);position:relative">' +
        '<div style="font-weight:700;font-size:13px">' + d + '</div>' +
        dayEvents +
      '</div>';
    }
    // trailing empty cells to fill 6-row grid (max 42 cells, but at least 35)
    const used = startDow + daysInMonth;
    const target = used <= 35 ? 35 : 42;
    for (let i = used; i < target; i++) cellsHtml += '<div style="background:#f8fafc;min-height:90px"></div>';

    box.innerHTML =
      '<div class="card" style="margin-bottom:16px"><div class="card-pad" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
        '<div style="display:flex;gap:8px">' +
          '<button class="btn btn-outline btn-sm" id="cal-prev">← ' + esc(AP.i18n.t('common.cancel', 'Prev').slice(0,0) || 'Əvvəl') + '</button>' +
          '<button class="btn btn-primary btn-sm" id="cal-today">' + esc(AP.i18n.t('dashboard.welcome').slice(0,0) || 'Bu gün') + ' Today</button>' +
          '<button class="btn btn-outline btn-sm" id="cal-next">' + (esc(AP.i18n.t('common.cancel','Next').slice(0,0) || 'Sonra') + ' →') + '</button>' +
        '</div>' +
        '<div style="font-size:18px;font-weight:700;text-transform:capitalize">' + esc(monthName) + '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px">' +
          '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#10b981;vertical-align:middle;margin-right:4px"></span>Holiday</span>' +
          '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1f2937;vertical-align:middle;margin-right:4px"></span>Mourning</span>' +
          '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#991b1b;vertical-align:middle;margin-right:4px"></span>Exam</span>' +
          '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#92400e;vertical-align:middle;margin-right:4px"></span>Cancelled</span>' +
        '</div>' +
      '</div></div>' +
      '<div class="card" style="overflow:hidden"><div style="display:grid;grid-template-columns:repeat(7,1fr);background:var(--border);gap:1px">' +
        dowLabels.map(l => '<div style="background:#f8fafc;padding:8px;text-align:center;font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">' + esc(l) + '</div>').join('') +
        cellsHtml +
      '</div></div>';

    // Simple i18n fallback for prev/today/next labels (overwrite real text)
    box.querySelector('#cal-prev').textContent = '← ' + (AP.i18n.getLang() === 'ru' ? 'Назад' : AP.i18n.getLang() === 'en' ? 'Prev' : 'Əvvəl');
    box.querySelector('#cal-today').textContent = AP.i18n.getLang() === 'ru' ? 'Сегодня' : AP.i18n.getLang() === 'en' ? 'Today' : 'Bu gün';
    box.querySelector('#cal-next').textContent = (AP.i18n.getLang() === 'ru' ? 'Вперёд' : AP.i18n.getLang() === 'en' ? 'Next' : 'Sonra') + ' →';

    box.querySelector('#cal-prev').addEventListener('click', () => {
      calendarState.month--;
      if (calendarState.month < 0) { calendarState.month = 11; calendarState.year--; }
      renderCalendarMonth(box);
    });
    box.querySelector('#cal-next').addEventListener('click', () => {
      calendarState.month++;
      if (calendarState.month > 11) { calendarState.month = 0; calendarState.year++; }
      renderCalendarMonth(box);
    });
    box.querySelector('#cal-today').addEventListener('click', () => {
      const n = new Date();
      calendarState.year = n.getFullYear();
      calendarState.month = n.getMonth();
      renderCalendarMonth(box);
    });
  }

  let _editingRequestId = null;

  let _reqTab = 'ALL';
  async function loadStudentRequests() {
    let [items, quota] = await Promise.all([
      AP.api.myRequests(),
      AP.api.myRequestQuota().catch(() => ({ used: 0, limit: 5, remaining: 5 })),
    ]);

    // Show quota + disable button if exhausted
    const qBox = document.getElementById('s-req-quota');
    const btnNew = document.getElementById('btn-new-request');
    const left = quota.remaining;
    const e = left === 0 ? '🔴' : left === 1 ? '🟡' : '🟢';
    qBox.innerHTML = e + ' ' + esc(AP.i18n.t('requests.daily_limit', 'Gündəlik limit')) +
      ': <b>' + quota.used + '/' + quota.limit + '</b> ' +
      esc(AP.i18n.t('requests.daily_used', 'istifadə olunub')) +
      ' · <b>' + left + '</b> ' + esc(AP.i18n.t('requests.daily_remaining', 'qalıb'));
    btnNew.disabled = (left === 0);
    btnNew.style.opacity = left === 0 ? '0.5' : '1';
    btnNew.style.cursor = left === 0 ? 'not-allowed' : 'pointer';

    // Вкладки: Все / Апелляции / Справки / Другое (фильтр по существующему Request.type)
    const tabsEl = document.getElementById('s-req-tabs');
    const TABS = [['ALL', AP.i18n.t('ap.tab_all')], ['APPEAL', AP.i18n.t('ap.tab_appeals')], ['CERTIFICATE', AP.i18n.t('ap.tab_certificates')], ['OTHER', AP.i18n.t('ap.tab_other')]];
    const inTab = (r) => _reqTab === 'ALL' || r.type === _reqTab || (_reqTab === 'OTHER' && (r.type === 'OTHER' || r.type === 'TRANSFER'));
    tabsEl.innerHTML = TABS.map(([k, l]) => '<button class="ex-tab' + (_reqTab === k ? ' on' : '') + '" data-rtab="' + k + '" role="tab">' + esc(l) + ' <span class="ex-n">' + items.filter((r) => k === 'ALL' || r.type === k || (k === 'OTHER' && (r.type === 'OTHER' || r.type === 'TRANSFER'))).length + '</span></button>').join('');
    tabsEl.querySelectorAll('[data-rtab]').forEach((b) => b.addEventListener('click', () => { _reqTab = b.dataset.rtab; loadStudentRequests(); }));
    items = items.filter(inTab);
    const list = document.getElementById('s-req-list');
    if (!items.length) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">📩</div><div>' + esc(AP.i18n.t('requests.no_requests', 'Müraciət yoxdur')) + '</div></div>';
      return;
    }
    const typeMap = {
      CERTIFICATE: AP.i18n.t('requests.certificate', 'Arayış'),
      APPEAL: AP.i18n.t('requests.appeal', 'İtiraz'),
      TRANSFER: AP.i18n.t('requests.transfer', 'Köçürmə'),
      OTHER: AP.i18n.t('requests.other', 'Digər'),
    };
    const statusMap = {
      PENDING:  { c: 'badge-warning', l: AP.i18n.t('requests.status.pending', 'İşlənir') },
      UNDER_REVIEW: { c: 'badge-info', l: AP.i18n.t('requests.status.under_review') },
      PARTIALLY_APPROVED: { c: 'badge-success', l: AP.i18n.t('requests.status.partially_approved') },
      WITHDRAWN: { c: 'badge-gray', l: AP.i18n.t('requests.status.withdrawn') },
      APPROVED: { c: 'badge-success', l: AP.i18n.t('requests.status.approved', 'Təsdiq edildi') },
      REJECTED: { c: 'badge-danger',  l: AP.i18n.t('requests.status.rejected', 'Rədd edildi') },
    };
    list.innerHTML = items.map(r => {
      const si = statusMap[r.status] || { c: 'badge-gray', l: r.status };
      const noteBlock = r.adminNote
        ? '<div style="margin-top:10px;padding:10px 12px;background:#f0fdf4;border-radius:8px;font-size:13px;color:#166534;border:1px solid #bbf7d0">📝 ' + esc(r.adminNote) + '</div>'
        : '';
      const canEdit = r.status === 'PENDING' && !r.appeal; // апелляция по экзамену: детали / отзыв, без удаления
      const appealBlock = r.appeal
        ? '<div style="margin-top:8px;font-size:13px"><b>#' + esc(r.appeal.code) + '</b> · ' + esc(r.appeal.subject || '') + ' · ' + esc(r.appeal.exam || '') + ' · ' + esc(AP.i18n.t('ap.disputed_n').replace('{n}', r.appeal.disputed)) + '</div>' +
          '<div style="margin-top:8px"><button class="btn btn-outline btn-sm" data-appeal="' + esc(r.id) + '">' + esc(AP.i18n.t('ap.details')) + '</button></div>'
        : '';
      const actions = canEdit
        ? '<div style="display:flex;gap:6px;margin-top:10px">' +
            '<button class="btn btn-outline btn-sm" data-edit-req="' + esc(r.id) + '" data-type="' + esc(r.type) + '" data-desc="' + esc(r.description) + '">✏️ ' + esc(AP.i18n.t('common.edit', 'Redaktə et')) + '</button>' +
            '<button class="btn btn-danger btn-sm"  data-del-req="'  + esc(r.id) + '">🗑 ' + esc(AP.i18n.t('common.delete', 'Sil')) + '</button>' +
          '</div>'
        : '';
      return '<div class="card" style="margin-bottom:12px"><div class="card-pad">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px">' +
          '<div style="flex:1;min-width:0">' +
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">' +
              '<span style="font-size:14px;font-weight:600">' + esc(typeMap[r.type] || r.type) + '</span>' +
              '<span class="badge ' + si.c + '">' + esc(si.l) + '</span>' +
            '</div>' +
            '<p style="font-size:13px;color:var(--muted);margin:0;line-height:1.55;white-space:pre-wrap;word-wrap:break-word">' + esc(r.description) + '</p>' +
            appealBlock +
            noteBlock +
            actions +
          '</div>' +
          '<span style="font-size:12px;color:#94a3b8;white-space:nowrap">' + fmtDate(r.createdAt) + '</span>' +
        '</div>' +
      '</div></div>';
    }).join('');

    list.querySelectorAll('[data-edit-req]').forEach(b => b.addEventListener('click', () => {
      _editingRequestId = b.getAttribute('data-edit-req');
      document.getElementById('r-type').value = b.getAttribute('data-type');
      document.getElementById('r-desc').value = b.getAttribute('data-desc');
      const ttl = document.querySelector('#request-modal .modal-title');
      if (ttl) ttl.textContent = AP.i18n.t('requests.edit', 'Müraciəti redaktə et');
      openModal('request-modal');
    }));

    list.querySelectorAll('[data-appeal]').forEach(b => b.addEventListener('click', () => AP.appeals.openRequest(b.dataset.appeal, loadStudentRequests)));

    list.querySelectorAll('[data-del-req]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm(AP.i18n.t('requests.delete_confirm', 'Müraciəti silmək istədiyinizə əminsiniz?'))) return;
      try {
        await AP.api.deleteMyRequest(b.getAttribute('data-del-req'));
        toast(AP.i18n.t('requests.deleted', 'Müraciət silindi'));
        await loadStudentRequests();
      } catch (e) { toast(e.message || 'error', true); }
    }));
  }

  // ═══ NOTIFICATIONS (backend-backed) ═══
  const NOTIF_TYPES = ['ACADEMIC', 'ASSIGNMENT', 'SCHEDULE', 'ADMINISTRATIVE', 'REQUEST', 'PAYMENT'];
  const NOTIF_ICON = { ACADEMIC: '🎓', ASSIGNMENT: '📝', SCHEDULE: '📅', ADMINISTRATIVE: '📢', REQUEST: '✉️', PAYMENT: '💳' };
  const NOTIF_LINK = { grades: 's-grades', assignments: 's-assignments', calendar: 's-schedule', announcements: 'announcements', payments: 's-payments', requests: 's-requests' };
  const notifState = { filter: 'ALL', open: false, unread: 0 };

  function setBadge(n) {
    notifState.unread = n;
    const b = document.getElementById('notif-badge');
    b.textContent = n > 99 ? '99+' : String(n);
    b.classList.toggle('show', n > 0);
    document.getElementById('notif-btn').setAttribute('aria-label', AP.i18n.t('notif.title') + (n > 0 ? ' (' + n + ')' : ''));
    document.getElementById('notif-readall').disabled = n === 0;
  }
  async function refreshNotifBadge() {
    try { setBadge((await AP.api.notifications.unreadCount()).count); } catch { /* сеть недоступна — оставляем прежний счётчик */ }
  }
  function closeNotifPanel() {
    notifState.open = false;
    document.getElementById('notif-panel').classList.remove('open');
    document.getElementById('notif-btn').setAttribute('aria-expanded', 'false');
  }
  function renderNotifFilters() {
    const t = AP.i18n.t;
    const opts = [['ALL', t('notif.all')], ['UNREAD', t('notif.unread')]].concat(NOTIF_TYPES.map(k => [k, t('notif.type.' + k)]));
    const box = document.getElementById('notif-filters');
    box.innerHTML = opts.map(([k, l]) => '<button type="button" class="chip-btn' + (notifState.filter === k ? ' active' : '') + '" data-nf="' + k + '" aria-pressed="' + (notifState.filter === k) + '">' + esc(l) + '</button>').join('');
    box.querySelectorAll('[data-nf]').forEach(b => b.addEventListener('click', () => { notifState.filter = b.dataset.nf; renderNotifFilters(); loadNotifList(); }));
  }
  async function loadNotifList() {
    const t = AP.i18n.t;
    const list = document.getElementById('notif-list');
    list.innerHTML = '<div class="skel skel-row"></div>'.repeat(3);
    const f = notifState.filter;
    try {
      const res = await AP.api.notifications.list({ unread: f === 'UNREAD', type: NOTIF_TYPES.includes(f) ? f : undefined });
      setBadge(res.unreadCount);
      if (!res.items.length) { list.innerHTML = '<div class="empty">' + esc(f === 'UNREAD' ? t('notif.empty_unread') : t('notif.empty')) + '</div>'; return; }
      list.innerHTML = res.items.map(n =>
        '<button type="button" class="notif-item' + (n.readAt ? '' : ' unread') + '" data-nid="' + esc(n.id) + '" data-nlink="' + esc(n.link || '') + '">' +
          '<span class="notif-dot" aria-hidden="true"></span>' +
          '<span style="min-width:0;flex:1"><div class="notif-title">' + (NOTIF_ICON[n.type] || '') + ' ' + esc(n.title) + '</div>' +
          '<div class="notif-msg">' + esc(n.message) + '</div>' +
          '<div class="notif-meta"><span>' + esc(t('notif.type.' + n.type)) + '</span><span>' + esc(fmtDateTime(n.createdAt)) + '</span></div></span>' +
        '</button>').join('');
      list.querySelectorAll('.notif-item').forEach(el => el.addEventListener('click', async () => {
        const id = el.dataset.nid, page = NOTIF_LINK[el.dataset.nlink];
        if (el.classList.contains('unread')) {
          el.classList.remove('unread');
          AP.api.notifications.markRead(id).then(r => setBadge(r.unreadCount)).catch(() => { el.classList.add('unread'); });
        }
        const allowed = navItemsForUser().some(i => i.key === page);
        if (page && allowed) { closeNotifPanel(); await showPage(page); }
      }));
    } catch (e) {
      list.innerHTML = '<div class="empty" style="color:var(--danger)">' + esc(t('notif.load_error')) +
        '<div style="margin-top:10px"><button type="button" class="btn btn-outline btn-sm" id="notif-retry">' + esc(t('notif.retry')) + '</button></div></div>';
      document.getElementById('notif-retry').addEventListener('click', loadNotifList);
    }
  }
  function initNotifications() {
    renderNotifFilters();
    refreshNotifBadge();
    document.getElementById('notif-btn').addEventListener('click', () => {
      notifState.open = !notifState.open;
      document.getElementById('notif-panel').classList.toggle('open', notifState.open);
      document.getElementById('notif-btn').setAttribute('aria-expanded', String(notifState.open));
      if (notifState.open) { renderNotifFilters(); loadNotifList(); }
    });
    document.getElementById('notif-readall').addEventListener('click', async () => {
      try { await AP.api.notifications.markAllRead(); setBadge(0); toast(AP.i18n.t('notif.marked_all')); await loadNotifList(); }
      catch (e) { toast(e.message || AP.i18n.t('common.error'), true); }
    });
    document.addEventListener('click', (e) => { if (notifState.open && !e.target.closest('#notif-wrap')) closeNotifPanel(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeNotifPanel(); closeMore(); } });
    setInterval(() => { if (!document.hidden) refreshNotifBadge(); }, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshNotifBadge(); });
  }

  if (!user) { location.href = '/login.html'; return; }
  if (user.role === 'ADMIN' || user.role === 'SUPER_ADMIN') { location.href = '/admin-dashboard.html'; return; }
  if (user.role === 'PROCTOR') { location.href = '/proctor.html'; return; }

  currentUser = user;
  document.getElementById('app').style.display = 'flex';
  if (AP.viewAs) AP.viewAs.banner();
  if (user.role === 'TEACHER') document.body.classList.add('teacher-mode');
  document.getElementById('sb-name').textContent = user.fullName || '—';
  document.getElementById('sb-id').textContent   = user.loginId  || '—';
  document.getElementById('sb-role').textContent = user.role   || '—';
  document.getElementById('sb-avatar').textContent = String(user.fullName || 'U').split(' ').filter(Boolean).slice(0, 2).map(s => s[0]).join('').toUpperCase() || 'U';

  renderNav();
  initNotifications();
  const deep = /^#(review|appeal)=([\w-]+)$/.exec(location.hash || '');
  if (deep && user.role === 'STUDENT') {
    history.replaceState(null, '', location.pathname);
    await showPage('s-exams');
    AP.appeals.openReview(decodeURIComponent(deep[2]), { appeal: deep[1] === 'appeal', onDone: () => showPage('s-exams') });
  } else showPage(user.role === 'TEACHER' ? 't-dashboard' : 's-dashboard');

  // Активируем Lətif AI бота
  if (window.AP && AP.aiChat) AP.aiChat.setUser(user);

  document.addEventListener('ap:lang-changed', () => { refreshLangBtns(); if (currentUser) renderNav(); if (currentPage) showPage(currentPage); });

})();
</script>
</body>
</html>
