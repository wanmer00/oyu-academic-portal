<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Odlar Yurdu University — Academic Portal</title>
<meta name="description" content="Odlar Yurdu University — Academic Management Portal">
<meta property="og:title" content="Odlar Yurdu University — Academic Portal">
<meta property="og:description" content="Odlar Yurdu University — Academic Management Portal">
<meta property="og:type" content="website">
<meta property="og:image" content="/img/logo.png">
<link rel="icon" type="image/png" href="/img/logo.png">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/ai-chat.css">
<link rel="stylesheet" href="/css/teacher.css">
<link rel="stylesheet" href="/css/exams.css">
<link rel="stylesheet" href="/css/journal.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#0f172a;-webkit-font-smoothing:antialiased}
:root{--sidebar:#0d1b2a;--primary:#2563eb;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--border:#e2e8f0;--muted:#64748b;--teacher:#7c3aed}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:248px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
html,body{overflow-x:hidden}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:28px;position:relative;background:radial-gradient(ellipse at 20% 10%,rgba(37,99,235,.06),transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(139,92,246,.05),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(37,99,235,.03),transparent 70%)}
.main::before{content:'';position:fixed;top:50%;left:calc(50% + 124px);transform:translate(-50%,-50%);width:min(68vmin,680px);height:min(68vmin,680px);background:url('/img/logo.png') center/contain no-repeat;opacity:.045;pointer-events:none;z-index:0;filter:saturate(.6)}
.main::after{content:'';position:fixed;top:-120px;right:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.12) 0%,transparent 70%);pointer-events:none;z-index:0;filter:blur(4px)}
@keyframes ap-pulse{0%,100%{opacity:.045;transform:translate(-50%,-50%) scale(1)}50%{opacity:.08;transform:translate(-50%,-50%) scale(1.04)}}
[data-theme="dark"] .main{background:radial-gradient(ellipse at 20% 10%,rgba(59,130,246,.1),transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(139,92,246,.08),transparent 55%),radial-gradient(ellipse at 50% 50%,rgba(37,99,235,.05),transparent 70%)}
[data-theme="dark"] .main::before{opacity:.06;filter:invert(1) hue-rotate(180deg) brightness(1.2) saturate(.7)}
[data-theme="dark"] .main::after{background:radial-gradient(circle,rgba(59,130,246,.18) 0%,transparent 70%)}
.main > *{position:relative;z-index:1}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.sb-logo-box{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0d1b2a;font-size:11px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sb-logo-box img{width:92%;height:92%;object-fit:contain}
.teacher-mode .sb-logo-box{background:#fff}
.sb-logo-text{color:#e2e8f0;font-weight:700;font-size:16px}
.sb-user{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;transition:background .15s}
.sb-user:hover{background:rgba(255,255,255,.04)}
.sb-avatar{width:36px;height:36px;border-radius:8px;background:#1e3a5f;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
.teacher-mode .sb-avatar{background:#2d1b69}
.sb-name{color:#e2e8f0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-id{color:#64748b;font-size:11px;font-family:Consolas,monospace}
.sb-role-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:2px;display:inline-block;background:#1e3a5f;color:#93c5fd}
.teacher-mode .sb-role-badge{background:#2d1b69;color:#c4b5fd}
.sb-nav{flex:1;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;margin:1px 8px;border-radius:8px;cursor:pointer;color:#94a3b8;font-size:13.5px;font-weight:500;transition:all .15s;border:none;background:none;width:calc(100% - 16px);text-align:left;font-family:inherit}
.nav-item:hover{background:#1a2d42;color:#e2e8f0}
.nav-item.active{background:#1e3a5f;color:#fff}
.teacher-mode .nav-item.active{background:#2d1b69}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.sb-bottom{padding:8px 0 16px;border-top:1px solid rgba(255,255,255,.08)}
.main > .page-header{z-index:30}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.3px}
.header-right{display:flex;align-items:center;gap:8px}
.lang-switcher{display:flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px}
.lang-btn{padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:#64748b;font-family:inherit}
.lang-btn.active{background:#f1f5f9;color:#0f172a}
.card{background:#fff;border-radius:12px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-pad{padding:20px}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;border:1px solid var(--border);padding:20px}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:18px}
.stat-val{font-size:26px;font-weight:700;letter-spacing:-.5px}
.stat-label{font-size:13px;color:var(--muted);margin-top:4px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.badge-success{background:#d1fae5;color:#065f46}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.badge-gray{background:#f1f5f9;color:#475569}
.badge-purple{background:#ede9fe;color:#5b21b6}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-purple{background:#7c3aed;color:#fff}.btn-purple:hover{background:#6d28d9}
.btn-success{background:#10b981;color:#fff}.btn-success:hover{background:#059669}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
.btn-outline{background:#fff;color:var(--muted);border:1px solid var(--border)}.btn-outline:hover{background:#f8fafc}
.btn-sm{padding:6px 12px;font-size:13px}
.input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:14px;outline:none;font-family:inherit}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
select.input{cursor:pointer}
textarea.input{min-height:80px;resize:vertical;font-family:inherit}
table{width:100%;border-collapse:collapse}
th{padding:11px 16px;text-align:left;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;background:#f8fafc;border-bottom:1px solid var(--border)}
td{padding:12px 16px;font-size:14px;border-top:1px solid #f1f5f9;vertical-align:top}
tr:hover td{background:#f8fafc}
.page{display:none}.page.active{display:block}
.prog{height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden}
.prog-bar{height:100%;border-radius:99px;background:var(--primary)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:10px;background:#10b981;color:#fff;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.15);opacity:0;transform:translateY(12px);transition:all .2s;z-index:300}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:#ef4444}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.schedule-grid{display:grid;grid-template-columns:80px repeat(5,1fr);gap:1px;background:var(--border)}
.schedule-grid>div{background:#fff;padding:12px 10px;min-height:48px;font-size:13px}
.schedule-grid .slot{cursor:pointer;font-weight:500}
.schedule-grid .slot-code{font-weight:700;font-size:12px;margin-bottom:2px}
.schedule-grid .slot-room{font-size:11px;color:var(--muted)}
.schedule-grid .dow-head,.schedule-grid .time-head{font-weight:700;font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:270;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.form-row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#f1f5f9;color:#475569;margin-right:4px}
.att-grid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.att-name{font-weight:600}
.att-choices{display:flex;gap:4px}
.att-choice{padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--muted);font-family:inherit}
.att-choice.active{border-color:currentColor}
.att-choice.present.active{color:#10b981;background:#d1fae5}
.att-choice.absent.active{color:#ef4444;background:#fee2e2}
.att-choice.late.active{color:#f59e0b;background:#fef3c7}
.att-choice.excused.active{color:#3b82f6;background:#dbeafe}
/* ── Responsive: tablet ── */
@media(max-width:1100px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}.sidebar{width:68px}.sb-logo-text,.sb-name,.sb-id,.sb-role-badge{display:none}.nav-item span{display:none}.main{padding:20px}}

/* AI assistant styles moved to /css/ai-chat.css (см. конец head) */
.ai-fab-old{display:none}
.ai-fab-legacy{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);border:none;cursor:pointer;z-index:250;display:none;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(37,99,235,.4);transition:all .3s cubic-bezier(.4,0,.2,1)}
.ai-fab:hover{transform:scale(1.08);box-shadow:0 8px 32px rgba(37,99,235,.5)}
.ai-fab:active{transform:scale(.95)}
.ai-fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;transition:all .3s}
.ai-fab.open svg.icon-chat{display:none}
.ai-fab:not(.open) svg.icon-close{display:none}
.ai-fab .ai-fab-pulse{position:absolute;inset:0;border-radius:50%;background:rgba(37,99,235,.3);animation:ai-pulse 2s ease-out infinite;pointer-events:none}
.ai-fab.open .ai-fab-pulse{display:none}
@keyframes ai-pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}
.ai-panel{position:fixed;bottom:92px;right:24px;width:400px;max-height:min(600px,calc(100vh - 120px));border-radius:16px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);z-index:250;display:flex;flex-direction:column;overflow:hidden;transform:translateY(16px) scale(.95);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.4,0,.2,1)}
.ai-panel.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
.ai-panel-head{padding:16px 18px;background:linear-gradient(135deg,#0d1b2a,#1e3a5f);display:flex;align-items:center;gap:12px;flex-shrink:0}
.ai-panel-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.ai-panel-title{color:#fff;font-size:15px;font-weight:700}
.ai-panel-sub{color:#94a3b8;font-size:11px;margin-top:1px}
.ai-panel-clear{margin-left:auto;background:rgba(255,255,255,.1);border:none;border-radius:8px;padding:6px 10px;color:#94a3b8;font-size:11px;cursor:pointer;transition:all .15s;font-family:inherit}
.ai-panel-clear:hover{background:rgba(255,255,255,.2);color:#fff}
.ai-panel-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:200px;scroll-behavior:smooth;background:#fff}
.ai-msg{max-width:88%;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.55;animation:ai-msg-in .25s ease;word-wrap:break-word}
@keyframes ai-msg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ai-msg-user{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:4px}
.ai-msg-bot{align-self:flex-start;background:#f1f5f9;color:#0f172a;border-bottom-left-radius:4px}
.ai-msg-bot strong{color:#1e40af}
.ai-msg-bot code{background:#e2e8f0;padding:1px 5px;border-radius:4px;font-size:12px;font-family:Consolas,monospace}
.ai-msg-typing{align-self:flex-start;background:#f1f5f9;border-radius:12px;padding:12px 18px;display:flex;gap:5px}
.ai-msg-typing span{width:7px;height:7px;border-radius:50%;background:#94a3b8;animation:ai-dot 1.4s ease infinite}
.ai-msg-typing span:nth-child(2){animation-delay:.15s}
.ai-msg-typing span:nth-child(3){animation-delay:.3s}
@keyframes ai-dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.ai-welcome{text-align:center;padding:20px 12px}
.ai-welcome-icon{font-size:40px;margin-bottom:10px}
.ai-welcome-title{font-size:16px;font-weight:700;margin-bottom:6px;color:#0f172a}
.ai-welcome-desc{font-size:13px;color:#64748b;line-height:1.6;margin-bottom:14px;text-align:left}
.ai-quick-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ai-quick-btn{padding:7px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:12px;color:#475569;cursor:pointer;transition:all .15s;font-family:inherit}
.ai-quick-btn:hover{background:#eff6ff;border-color:#93c5fd;color:#1e40af}
.ai-panel-input{padding:12px 16px;border-top:1px solid #e2e8f0;display:flex;gap:8px;flex-shrink:0;background:#fff}
.ai-panel-input textarea{flex:1;resize:none;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.4;max-height:100px;outline:none;transition:border-color .15s;font-family:inherit;background:#f8fafc;color:#0f172a}
.ai-panel-input textarea:focus{border-color:#3b82f6;background:#fff}
.ai-panel-input textarea::placeholder{color:#94a3b8}
.ai-send-btn{width:40px;height:40px;border-radius:10px;border:none;background:linear-gradient(135deg,#2563eb,#7c3aed);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;align-self:flex-end}
.ai-send-btn:hover{transform:scale(1.05)}
.ai-send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.ai-send-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
[data-theme="dark"] .ai-panel,[data-theme="dark"] .ai-panel-body,[data-theme="dark"] .ai-panel-input{background:#1e293b}
[data-theme="dark"] .ai-msg-bot{background:#263350;color:#e2e8f0}
[data-theme="dark"] .ai-msg-bot strong{color:#60a5fa}
[data-theme="dark"] .ai-msg-bot code{background:#334155;color:#93c5fd}
[data-theme="dark"] .ai-msg-typing{background:#263350}
[data-theme="dark"] .ai-msg-typing span{background:#475569}
[data-theme="dark"] .ai-welcome-title{color:#e2e8f0}
[data-theme="dark"] .ai-welcome-desc{color:#94a3b8}
[data-theme="dark"] .ai-quick-btn{background:#263350;border-color:#334155;color:#cbd5e1}
[data-theme="dark"] .ai-quick-btn:hover{background:#1e3a5f;border-color:#3b82f6;color:#93c5fd}
[data-theme="dark"] .ai-panel-input{border-top-color:#334155}
[data-theme="dark"] .ai-panel-input textarea{background:#0f172a;border-color:#334155;color:#e2e8f0}
@media(max-width:480px){.ai-panel{right:8px;left:8px;bottom:84px;width:auto;max-height:calc(100vh - 100px)}.ai-fab{bottom:16px;right:16px;width:50px;height:50px}}

/* ── Notifications bell ── */
.notif-wrap{position:relative}
.icon-btn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.icon-btn:hover{background:var(--c-surface)}
.icon-btn svg{width:18px;height:18px}
.notif-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;display:none;align-items:center;justify-content:center;border:2px solid var(--c-bg)}
.notif-badge.show{display:inline-flex}
.notif-panel{position:absolute;right:0;top:46px;width:380px;max-width:calc(100vw - 24px);max-height:min(560px,calc(100vh - 110px));display:none;flex-direction:column;background:var(--c-card);border:1px solid var(--c-border);border-radius:14px;box-shadow:0 20px 50px var(--c-shadow),0 4px 12px var(--c-shadow);z-index:220;overflow:hidden}
.notif-panel.open{display:flex}
.notif-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 8px}
.notif-head b{font-size:15px;color:var(--c-text1)}
.notif-link{background:none;border:none;color:var(--primary);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;padding:4px 6px;border-radius:6px}
.notif-link:hover{background:var(--c-surface)}
.notif-link:disabled{color:var(--c-text3);cursor:default;background:none}
.notif-filters{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.notif-filters::-webkit-scrollbar{display:none}
.chip-btn{flex-shrink:0;padding:5px 11px;border-radius:99px;border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.chip-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.notif-list{overflow-y:auto;border-top:1px solid var(--c-border);flex:1;min-height:120px}
.notif-item{display:flex;gap:10px;width:100%;padding:12px 16px;border:none;border-bottom:1px solid var(--c-border);background:transparent;text-align:left;cursor:pointer;font-family:inherit;color:var(--c-text1)}
.notif-item:hover{background:var(--c-surface)}
.notif-item.unread{background:rgba(37,99,235,.06)}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex-shrink:0;visibility:hidden}
.notif-item.unread .notif-dot{visibility:visible}
.notif-title{font-size:13.5px;font-weight:600}
.notif-msg{font-size:12.5px;color:var(--c-text2);margin-top:2px;overflow-wrap:anywhere}
.notif-meta{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:11px;color:var(--c-text3)}
.skel{background:linear-gradient(90deg,var(--c-surface) 25%,var(--c-surface2) 50%,var(--c-surface) 75%);background-size:200% 100%;animation:skel 1.2s linear infinite;border-radius:8px}
@keyframes skel{to{background-position:-200% 0}}
.skel-row{height:44px;margin:10px 16px}

/* ── Home dashboard ── */
.home-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.home-hello{font-size:20px;font-weight:700;color:var(--c-text1)}
.home-date{font-size:13px;color:var(--c-text2);margin-top:2px}
.qa-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.qa-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:12px;border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text1);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s}
.qa-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--c-shadow)}
.qa-btn svg{width:20px;height:20px;color:var(--primary)}
.home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px}
.home-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--c-border)}
.home-row:last-child{border-bottom:none}
.home-row .t{font-weight:600;font-size:14px}
.home-row .s{font-size:12px;color:var(--c-text2);margin-top:2px}
.pill-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill-info{background:#dbeafe;color:#1e40af}.pill-danger{background:#fee2e2;color:#991b1b}.pill-ok{background:#d1fae5;color:#065f46}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[data-theme="dark"] .pill-info{background:#1e3a5f;color:#93c5fd}
[data-theme="dark"] .pill-danger{background:#4c1d1d;color:#fca5a5}
[data-theme="dark"] .pill-ok{background:#12372b;color:#6ee7b7}
.icon-btn:focus-visible,.chip-btn:focus-visible,.notif-item:focus-visible,.qa-btn:focus-visible,.mnav-btn:focus-visible,.nav-item:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ── Mobile bottom navigation (hidden on desktop/tablet) ── */
.mnav{display:none}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:260;display:none}
.sheet-overlay.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80vh;overflow-y:auto;background:var(--c-card);color:var(--c-text1);border-radius:18px 18px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-grip{width:40px;height:4px;border-radius:99px;background:var(--c-border);margin:0 auto 10px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text1);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center}
.sheet-item svg{width:20px;height:20px;color:var(--primary)}
.sheet-item.active{border-color:var(--primary)}

@media(max-width:768px){
  #app{height:100dvh}
  .sidebar{display:none}
  .main{padding:14px 14px calc(76px + env(safe-area-inset-bottom))}
  .main::before,.main::after{display:none}
  .page-header{margin-bottom:16px;gap:10px}
  .page-title{font-size:19px}
  .header-right{gap:6px;flex-wrap:wrap}
  .header-right > img{display:none}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px}.stat-val{font-size:22px}
  .home-grid{grid-template-columns:1fr}
  .qa-row{display:flex;overflow-x:auto;gap:8px;margin:0 -14px 14px;padding:2px 14px;scrollbar-width:none}
  .qa-row::-webkit-scrollbar{display:none}
  .qa-btn{flex:0 0 auto;flex-direction:row;gap:8px;padding:10px 14px;white-space:nowrap}
  .card-pad{padding:14px}
  table{display:block;overflow-x:auto;white-space:nowrap}
  .modal{padding:18px;max-height:92vh}
  .schedule-grid{overflow-x:auto}
  .notif-panel{position:fixed;left:8px;right:8px;top:64px;width:auto;max-width:none;max-height:calc(100dvh - 150px)}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:205;background:var(--c-card);border-top:1px solid var(--c-border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px var(--c-shadow)}
  .mnav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:none;background:none;color:var(--c-text2);font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:10px;min-width:0}
  .mnav-btn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mnav-btn svg{width:20px;height:20px}
  .mnav-btn.active{color:var(--primary)}
  .ai-fab{bottom:76px !important;right:14px !important}
  .ai-panel{bottom:136px !important}
  .toast{bottom:76px;left:14px;right:14px;text-align:center}
}
@media(max-width:380px){.stat-val{font-size:20px}}

<script>
(async function () {
  const DOW = ['', 'schedule.monday', 'schedule.tuesday', 'schedule.wednesday', 'schedule.thursday', 'schedule.friday', 'schedule.saturday', 'schedule.sunday'];
  let currentUser = null;
  let currentPage = null;
  let transcriptCache = null;  // cached transcript for filter options
  
  function toast(msg, isError) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2400);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function openModal(id) { document.getElementById(id).classList.add('show'); }
  function closeModal(id) { document.getElementById(id).classList.remove('show'); }
  document.querySelectorAll('[data-close-modal]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.closeModal)));

  function gradeColor(v) {
    if (v >= 90) return { bg: '#d1fae5', c: '#065f46' };
    if (v >= 75) return { bg: '#dbeafe', c: '#1e40af' };
    if (v >= 60) return { bg: '#fef3c7', c: '#92400e' };
    return { bg: '#fee2e2', c: '#991b1b' };
  }
  function fmtDate(iso) { try { return new Date(iso).toLocaleDateString(localeFor(), { day: 'numeric', month: 'short', year: 'numeric' }); } catch { return iso; } }
  function fmtDateTime(iso) { try { return new Date(iso).toLocaleString(localeFor()); } catch { return iso; } }
  function localeFor() { const l = AP.i18n.getLang(); return l === 'en' ? 'en-GB' : l === 'ru' ? 'ru-RU' : 'az-AZ'; }

  // ── Sidebar ──
  const NAV_STUDENT = [
    { key: 's-dashboard',   i18n: 'nav.dashboard',     icon: ic('dashboard') },
    { key: 's-my-subjects', i18n: 'my_subjects.title', icon: ic('book') },
    { key: 's-schedule',    i18n: 'nav.schedule',      icon: ic('schedule') },
    { key: 's-progress',    i18n: 'sp.title',          icon: ic('check') },
    { key: 's-exams',       i18n: 'ex.nav',            icon: ic('exam') },
    { key: 's-transcript',  i18n: 'transcript.title',  icon: ic('doc') },
    { key: 's-assignments', i18n: 'nav.assignments',   icon: ic('clipboard') },
    { key: 's-grades',      i18n: 'journal.title',     icon: ic('grades') },
    { key: 's-attendance',  i18n: 'dashboard.attendance', icon: ic('check') },
    { key: 's-materials',   i18n: 'nav.materials',     icon: ic('book') },
    { key: 's-requests',    i18n: 'nav.requests',      icon: ic('mail') },
    { key: 's-library',     i18n: 'nav.library',       icon: ic('book') },
    { key: 'announcements', i18n: 'nav.announcements', icon: ic('bell') },
    { key: 's-payments',    i18n: 'nav.payments',      icon: ic('card') },
  ];
  const NAV_TEACHER = [
    { key: 't-dashboard',   i18n: 'nav.dashboard',     icon: ic('dashboard') },
    { key: 't-classes',     i18n: 'tch.classes',       icon: ic('users') },
    { key: 't-timetable',   i18n: 'nav.schedule',      icon: ic('schedule') },
    { key: 't-journal',     i18n: 'journal.title',     icon: ic('journal') },
    { key: 't-exams',       i18n: 'ex.nav_teacher',    icon: ic('exam') },
    { key: 't-assignments', i18n: 'assignments.title', icon: ic('clipboard') },
    { key: 't-attendance',  i18n: 'attendance.title',  icon: ic('check') },
    { key: 't-materials',   i18n: 'materials.title',   icon: ic('book') },
    { key: 't-analytics',   i18n: 'nav.analytics',     icon: ic('chart') },
    { key: 't-requests',    i18n: 'nav.requests',      icon: ic('mail') },
    { key: 'announcements', i18n: 'nav.announcements', icon: ic('bell') },
  ];

  function ic(name) {

  function renderNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = '';
    const items = currentUser.role === 'TEACHER' ? NAV_TEACHER : NAV_STUDENT;
    for (const it of items) {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (currentPage === it.key ? ' active' : '');
      btn.id = 'navbtn-' + it.key;
      btn.innerHTML = it.icon + '<span>' + AP.i18n.t(it.i18n) + '</span>';
      btn.addEventListener('click', () => showPage(it.key));
      nav.appendChild(btn);
    }
    renderMobileNav();
  }

  // ── Mobile bottom navigation: 4 primary tabs + "More" sheet with everything else ──
  const MOBILE_PRIMARY = {
    STUDENT: ['s-dashboard', 's-my-subjects', 's-schedule', 's-assignments'],
    TEACHER: ['t-dashboard', 't-journal', 't-assignments', 't-attendance'],
  };
  function navItemsForUser() { return currentUser.role === 'TEACHER' ? NAV_TEACHER : NAV_STUDENT; }
  function renderMobileNav() {
    if (!currentUser) return;
    const items = navItemsForUser();
    const primary = (MOBILE_PRIMARY[currentUser.role] || MOBILE_PRIMARY.STUDENT)
      .map(k => items.find(i => i.key === k)).filter(Boolean);
    const inPrimary = primary.some(i => i.key === currentPage);
    const bar = document.getElementById('mnav');
    bar.innerHTML = primary.map(it =>
      '<button class="mnav-btn' + (currentPage === it.key ? ' active' : '') + '" data-mnav="' + it.key + '"' + (currentPage === it.key ? ' aria-current="page"' : '') + '>' +
      it.icon + '<span>' + esc(AP.i18n.t(it.i18n)) + '</span></button>'
    ).join('') +
      '<button class="mnav-btn' + (!inPrimary && currentPage ? ' active' : '') + '" id="mnav-more" aria-haspopup="dialog">' + ic('more') + '<span>' + esc(AP.i18n.t('home.more')) + '</span></button>';
    bar.querySelectorAll('[data-mnav]').forEach(b => b.addEventListener('click', () => showPage(b.dataset.mnav)));
    document.getElementById('mnav-more').addEventListener('click', openMore);

    document.getElementById('more-grid').innerHTML = items.map(it =>
      '<button class="sheet-item' + (currentPage === it.key ? ' active' : '') + '" data-more="' + it.key + '">' + it.icon + '<span>' + esc(AP.i18n.t(it.i18n)) + '</span></button>'
    ).join('') +
      '<button class="sheet-item" data-more="profile">' + ic('user') + '<span>' + esc(AP.i18n.t('nav.profile')) + '</span></button>' +
      '<button class="sheet-item" data-more="__logout">' + ic('logout') + '<span>' + esc(AP.i18n.t('nav.logout')) + '</span></button>';
    document.querySelectorAll('#more-grid [data-more]').forEach(b => b.addEventListener('click', () => {
      closeMore();
      if (b.dataset.more === '__logout') document.getElementById('btn-logout').click();
      else showPage(b.dataset.more);
    }));
  }
  function openMore() { document.getElementById('more-overlay').classList.add('show'); }
  function closeMore() { document.getElementById('more-overlay').classList.remove('show'); }
  document.getElementById('more-overlay').addEventListener('click', (e) => { if (e.target.id === 'more-overlay') closeMore(); });

  function setPageTitle(key) {
    const map = {
      's-exams': 'ex.nav', 't-exams': 'ex.nav_teacher',
      's-dashboard': 'nav.dashboard',  's-my-subjects': 'my_subjects.title',
      's-schedule': 'nav.schedule',    's-progress': 'sp.title',    's-grades': 'journal.title',
      's-transcript': 'transcript.title', 's-assignments': 'assignments.title',
      's-attendance': 'dashboard.attendance','s-materials': 'materials.title',
      's-requests': 'requests.title',
      's-library': 'nav.library',
      'profile': 'nav.profile',
      'announcements': 'nav.announcements',
      's-payments': 'nav.payments',
      't-dashboard': 'nav.dashboard',  't-journal': 'journal.title',
      't-classes': 'tch.classes',      't-analytics': 'nav.analytics',
      't-assignments': 'assignments.title','t-attendance': 'attendance.title',
      't-materials': 'materials.title',
      't-requests': 'requests.title',
    };
    document.getElementById('page-title').textContent = AP.i18n.t(map[key] || key);
  }

  async function showPage(key) {
    currentPage = key;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item[id^="navbtn-"]').forEach(b => b.classList.remove('active'));
    const pg = document.getElementById('pg-' + key); if (pg) pg.classList.add('active');
    const btn = document.getElementById('navbtn-' + key); if (btn) btn.classList.add('active');
    setPageTitle(key);
    renderMobileNav();
    closeMore();
    closeNotifPanel();
    const main = document.querySelector('.main'); if (main) main.scrollTo({ top: 0 });
    try {
      switch (key) {
        case 's-dashboard':   await loadStudentDashboard(); break;
        case 's-my-subjects': await loadMySubjects(); break;
        case 's-schedule':    await loadStudentSchedule(); break;
        case 's-progress':    await AP.studentProgress.render('s-progress'); break;
        case 's-exams':       await AP.examsStudent.render('s-exams'); break;
        case 't-exams':       await AP.examsTeacher.render('t-exams'); break;
        case 's-grades':      await AP.journal.mount('jr-student', { role: 'STUDENT' }); break;
        case 's-transcript':  await loadStudentTranscript(); break;
        case 's-attendance':  await AP.journal.mount('jr-student-att', { role: 'STUDENT', mode: 'attendance' }); break;
        case 's-assignments': await loadStudentAssignments(); break;
        case 's-materials':   await loadStudentMaterials(); break;
        case 's-requests':    await loadStudentRequests(); break;
        case 's-library':     await loadStudentLibrary(); break;
        case 'profile':       await loadProfile(); break;
        case 'announcements': await loadAnnouncements(); break;
        case 's-payments':    await loadStudentPayments(); break;
        case 't-dashboard':   await teacherUI.dashboard(); break;
        case 't-classes':     await teacherUI.classes(); break;
        case 't-journal':     await teacherUI.journal(); break;
        case 't-attendance':  await teacherUI.attendance(); break;
        case 't-assignments': await teacherUI.assignments(); break;
        case 't-materials':   await teacherUI.materials(); break;
        case 't-analytics':   await teacherUI.analytics(); break;
        case 't-requests':    await teacherUI.requests(); break;
        case 't-timetable':   await teacherUI.timetable(); break;
      }
    } catch (e) { console.error(e); toast(e.message || AP.i18n.t('common.error'), true); }
  }

  // ═══ Row detail modals on click ═══
  document.addEventListener('click', (e) => {
    // Row detail: grades
    const gr = e.target.closest && e.target.closest('[data-grade-detail]');
    if (gr) { openRowDetail('grade', JSON.parse(gr.dataset.gradeDetail)); return; }
    // Row detail: assignments
    const ar = e.target.closest && e.target.closest('[data-assignment-detail]');
    if (ar) { openRowDetail('assignment', JSON.parse(ar.dataset.assignmentDetail)); return; }
    // Row detail: material
    const mr = e.target.closest && e.target.closest('[data-material-detail]');
    if (mr) { openRowDetail('material', JSON.parse(mr.dataset.materialDetail)); return; }
    // Row detail: request
    const rr = e.target.closest && e.target.closest('[data-request-detail]');
    if (rr) { openRowDetail('request', JSON.parse(rr.dataset.requestDetail)); return; }
    // Schedule slot in week view
    const sl = e.target.closest && e.target.closest('[data-slot-info]');
    if (sl) { openRowDetail('slot', JSON.parse(sl.dataset.slotInfo)); return; }
  });
