<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="OYU — Azerbaijan Republic Odlar Yurdu University, 1995">
  <defs>
    <!-- Верх: AZERBAIJAN REPUBLIC ODLAR YURDU UNIVERSITY -->
    <path id="topArc" d="M 80,320 A 240,240 0 0 1 560,320" fill="none"/>
  </defs>

  <style>
    .nv { fill:#133e7c; }
    .nv-s { stroke:#133e7c; fill:none; }
    .thin { stroke-width:1.2; }
    .med  { stroke-width:2; }
    .thick{ stroke-width:4; }
  </style>

  <!-- ─── Outer circle ─── -->
  <circle cx="320" cy="320" r="314" class="nv-s thick"/>
  <circle cx="320" cy="320" r="298" class="nv-s thin"/>

  <!-- ─── Globe grid (meridians / parallels) ─── -->
  <g class="nv-s thin">
    <ellipse cx="320" cy="320" rx="272" ry="272"/>
    <line x1="48"  y1="320" x2="592" y2="320"/>
    <ellipse cx="320" cy="320" rx="272" ry="90"/>
    <ellipse cx="320" cy="320" rx="272" ry="180"/>
    <ellipse cx="320" cy="320" rx="90"  ry="272"/>
    <ellipse cx="320" cy="320" rx="180" ry="272"/>
    <ellipse cx="320" cy="320" rx="255" ry="255"/>
  </g>

  <!-- ─── Top circular text ─── -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" letter-spacing="3" class="nv">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      AZERBAIJAN REPUBLIC · ODLAR YURDU UNIVERSITY
    </textPath>
  </text>

  <!-- ═══════════ CENTER: diamond + cap + flame ═══════════ -->
  <!-- Diamond (rhombus) with OYU -->
  <g>
    <!-- Big diamond shape -->
    <polygon points="320,150 438,238 320,326 202,238" class="nv"/>
    <!-- White triangular window for OYU text -->
    <polygon points="248,232 392,232 320,296" fill="#fff"/>
    <!-- OYU letters -->
    <text x="320" y="272" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="42" text-anchor="middle" class="nv">OYU</text>
  </g>

  <!-- Flame on top of diamond -->
  <g class="nv">
    <path d="M 320,96
             C 312,108 308,124 316,138
             C 306,132 302,120 306,108
             C 294,120 292,140 310,154
             C 302,152 294,144 292,136
             C 294,156 306,168 320,172
             C 334,168 346,156 348,136
             C 346,144 338,152 330,154
             C 348,140 346,120 334,108
             C 338,120 334,132 324,138
             C 332,124 328,108 320,96 Z"/>
  </g>

  <!-- Mortarboard (шапочка с кисточкой) — перевёрнутый V под ромбом -->
  <g class="nv">
    <!-- Верхняя плоскость -->
    <polygon points="220,326 420,326 376,372 264,372"/>
    <!-- Тело шапки (V-подобное) -->
    <polygon points="250,372 390,372 320,472"/>
    <!-- Белая разделительная линия -->
    <path d="M 220,326 L 320,472 L 420,326" stroke="#fff" stroke-width="3" fill="none"/>
    <!-- Tassel dot -->
    <circle cx="320" cy="326" r="5" fill="#fff"/>
  </g>

  <!-- ═══════════ HANDS (two stylized hands cupping) ═══════════ -->
  <g class="nv">
    <!-- Left hand -->
    <path d="M 180,360
             C 165,290 200,230 240,225
             C 252,225 260,232 262,242
             L 270,380
             C 270,398 256,410 236,410
             C 210,410 188,394 180,360 Z"/>
    <!-- Finger separation lines (white) -->
    <path d="M 196,290 C 208,274 224,266 242,266" stroke="#fff" stroke-width="2" fill="none"/>
    <path d="M 206,318 C 218,302 234,294 250,296" stroke="#fff" stroke-width="2" fill="none"/>
    <path d="M 216,344 C 228,330 242,324 258,326" stroke="#fff" stroke-width="2" fill="none"/>

    <!-- Right hand (mirrored) -->
    <path d="M 460,360
             C 475,290 440,230 400,225
             C 388,225 380,232 378,242
             L 370,380
             C 370,398 384,410 404,410
             C 430,410 452,394 460,360 Z"/>
    <path d="M 444,290 C 432,274 416,266 398,266" stroke="#fff" stroke-width="2" fill="none"/>
    <path d="M 434,318 C 422,302 406,294 390,296" stroke="#fff" stroke-width="2" fill="none"/>
    <path d="M 424,344 C 412,330 398,324 382,326" stroke="#fff" stroke-width="2" fill="none"/>
  </g>

  <!-- ═══════════ OPEN BOOK (bottom) ═══════════ -->
  <g class="nv">
    <!-- Book shape -->
    <path d="M 140,452
             C 160,442 240,430 316,448
             L 316,500
             C 240,482 160,494 140,504 Z"/>
    <path d="M 500,452
             C 480,442 400,430 324,448
             L 324,500
             C 400,482 480,494 500,504 Z"/>
    <!-- Central spine -->
    <path d="M 320,446 L 320,502" stroke="#fff" stroke-width="2"/>
    <!-- Page lines -->
    <path d="M 170,460 L 290,450 M 180,478 L 300,468" stroke="#fff" stroke-width="1" fill="none"/>
    <path d="M 470,460 L 350,450 M 460,478 L 340,468" stroke="#fff" stroke-width="1" fill="none"/>
  </g>

  <!-- ═══════════ BOTTOM BANNER + 1995 ═══════════ -->
  <!-- Decorative ribbon line -->
  <path d="M 100,528 L 540,528" class="nv-s" stroke-width="4" stroke-linecap="round"/>

  <!-- Two decorative arrows/rays with dots -->
  <g class="nv">
    <path d="M 100,560 L 236,560" stroke="#133e7c" stroke-width="2.5"/>
    <circle cx="100" cy="560" r="5"/>
    <path d="M 404,560 L 540,560" stroke="#133e7c" stroke-width="2.5"/>
    <circle cx="540" cy="560" r="5"/>
  </g>

  <!-- 1995 -->
  <text x="320" y="572" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="36" text-anchor="middle" class="nv" letter-spacing="6">1995</text>

  <!-- Small decorative arc at the very bottom -->
  <path d="M 150,596 Q 320,620 490,596" class="nv-s" stroke-width="2.5" fill="none"/>
</svg>
